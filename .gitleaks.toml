# Configurazione di gitleaks per il job `security` (.github/workflows/ci.yml, docs/security/ci-security.md).
# Regola 20 di CLAUDE.md (ADR-042, F2-SEC-12): nessun segreto nel codice. Si estendono le regole predefinite; le
# eccezioni sono solo per dati fittizi noti, ognuna con la giustificazione e limitata da percorso E valore.
# Non mettere mai qui un segreto vero: se un segreto vero è finito nella storia, si ruota e si segnala (SECURITY.md).

title = "Loyalty Hub"

[extend]
useDefault = true

# Esempio di corpo di richiesta nella documentazione d'integrazione: `idempotencyKey` è l'identificativo di
# deduplicazione scelto dal chiamante, non una credenziale; la regola generica lo scambia per una chiave d'API.
[[allowlists]]
description = "idempotencyKey negli esempi JSON della documentazione (identificativo di deduplicazione, non un segreto)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^docs/.*\.md$''']
regexTarget = "match"
regexes = ['''(?i)"?idempotencyKey"?\s*[:=]\s*"[^"\s]{1,80}"''']

# Credenziali di test PUBBLICHE della vetrina enterprise (ADR-051 decisione 1, Q-672, Q-676): password fisse e seme TOTP
# condiviso degli utenti di test, documentati in chiaro perche' chiunque possa provare la vetrina. Valgono solo per un
# ambiente di test: hub e BFF rifiutano questi utenti salvo LH_TEST_USERS_ALLOWED=true con LH_ENVIRONMENT=test, e il realm
# base (realm.json, realm-members.json) e il chart non ne contengono (scripts/check-realm.mjs). L'eccezione e' limitata ai
# soli file che le contengono, per percorso esatto: nessun altro file, nessun carattere jolly.
[[allowlists]]
description = "Utenti di test pubblici della vetrina: overlay dei realm e documenti che li elencano (ADR-051 decisione 1)"
paths = [
  '''^deploy/idp/vetrina/realm-vetrina-overlay\.json$''',
  '''^deploy/idp/vetrina/realm-members-vetrina-overlay\.json$''',
  '''^deploy/vetrina/README\.md$''',
  '''^concetti/vetrina-enterprise\.mdx$''',
]
