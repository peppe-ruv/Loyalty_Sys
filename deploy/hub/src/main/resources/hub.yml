# hub — deployable consolidato per la demo ospitata (docs/13 ADR-023). Config chiamata `hub.yml` (non
# application.yml) per non collidere con quelle dei servizi presenti sul classpath. server.port = ${PORT:8080}.
# Default `demo,inproc`: demo ospitata a costo zero senza broker (bus in-process, ADR-024). Con un broker
# reale (Kafka/Redpanda) avviare invece con SPRING_PROFILES_ACTIVE=demo (senza `inproc`).
spring:
  application:
    name: hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo,inproc}
  datasource:
    # Un solo database, search_path con i 4 schemi: le tabelle hanno nomi unici tra i servizi, quindi
    # ogni servizio risolve le proprie senza qualificarle; outbox/processed_event vivono nel primo schema.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyaltyhub?currentSchema=ingestion,member,campaign,wallet,insight,reward,gamification,engagement}
    username: ${DB_USERNAME:loyaltyhub}
    password: ${DB_PASSWORD:loyaltyhub}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 20000
      # search_path per ogni connessione: i 4 schemi del consolidato (ADR-023). Impostato via SET e non via
      # `currentSchema` nell'URL perché il proxy di Neon non inoltra il parametro di startup `options` (le
      # tabelle non qualificate risulterebbero inesistenti). Le migrazioni non ne dipendono: HubDatabase fissa
      # lo schema esplicitamente per ogni run Flyway.
      connection-init-sql: SET search_path TO ingestion, member, campaign, wallet, insight, reward, gamification, engagement
  flyway:
    enabled: false   # le migrazioni per schema le esegue HubDatabase (una per schema)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

loyaltyhub:
  service: hub
  kafka:
    # PLAINTEXT in locale; SSL_PEM (Aiven, certificato client) o SASL_SSL in demo. I PEM sono passati in
    # base64 via env (nessun file su disco): CA + cert + chiave. Vuoti se non usati.
    security: ${KAFKA_SECURITY:PLAINTEXT}
    ssl:
      ca-b64: ${KAFKA_SSL_CA_B64:}
      cert-b64: ${KAFKA_SSL_CERT_B64:}
      key-b64: ${KAFKA_SSL_KEY_B64:}
    sasl:
      username: ${KAFKA_SASL_USERNAME:}
      password: ${KAFKA_SASL_PASSWORD:}
      mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
  approval:
    enabled: false
  engine:
    max-multiplier: 5
  jobs:
    enabled: false
  # Riprocessa DLQ (insight → ingestion POST /v1/events, ADR-002 eccezione 1): nell'hub ingestion è nello stesso
  # processo, quindi il default è la porta locale del server web (nota solo dopo l'avvio; letta a ogni chiamata).
  insight:
    ingestion-url: ${LH_INGESTION_URL:http://localhost:${local.server.port:${server.port:8080}}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

---
# Profilo inproc (docs/13 ADR-024): nessun broker Kafka. I container dei @KafkaListener non partono
# (li rimpiazza il bus in-process HubInProcessBus); il KafkaTemplate è quello del bus, non tocca il broker.
spring:
  config:
    activate:
      on-profile: inproc
  kafka:
    listener:
      auto-startup: false
