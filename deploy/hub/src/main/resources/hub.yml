# hub — deployable consolidato per la demo ospitata (docs/13 ADR-023). Config chiamata `hub.yml` (non
# application.yml) per non collidere con quelle dei servizi presenti sul classpath. server.port = ${PORT:8080}.
spring:
  application:
    name: hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    # Un solo database, search_path con i 4 schemi: le tabelle hanno nomi unici tra i servizi, quindi
    # ogni servizio risolve le proprie senza qualificarle; outbox/processed_event vivono nel primo schema.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyaltyhub?currentSchema=ingestion,member,campaign,wallet}
    username: ${DB_USERNAME:loyaltyhub}
    password: ${DB_PASSWORD:loyaltyhub}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 20000
  flyway:
    enabled: false   # le migrazioni per schema le esegue HubDatabase (una per schema)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

loyaltyhub:
  service: hub
  kafka:
    security: ${KAFKA_SECURITY:PLAINTEXT}
  approval:
    enabled: false
  engine:
    max-multiplier: 5
  jobs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
