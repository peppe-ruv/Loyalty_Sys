# Apache Superset (chart ufficiale superset/superset) in HA: metadati su RDS Postgres, Redis ElastiCache, worker e beat Celery, init idempotente.
# helm upgrade --install superset superset/superset -n analytics -f questo-file
image: { repository: apache/superset, tag: "5.0.0" }
bootstrapScript: |
  #!/bin/bash
  pip install clickhouse-connect==0.8.18 psycopg2-binary authlib >/dev/null
configOverrides:
  loyalty: |
    exec(open("/app/pythonpath/loyalty_config.py").read())
extraConfigs:
  loyalty_config.py: |
    # contenuto di analytics/superset/superset_config.py (montato dal chart in /app/pythonpath)
extraEnvRaw:
  - { name: SUPERSET_SECRET_KEY, valueFrom: { secretKeyRef: { name: observability-db, key: SUPERSET_SECRET_KEY } } }
  - { name: SUPERSET_DB_HOST, valueFrom: { secretKeyRef: { name: observability-db, key: SUPERSET_DB_HOST } } }
  - { name: SUPERSET_DB_USER, valueFrom: { secretKeyRef: { name: observability-db, key: SUPERSET_DB_USER } } }
  - { name: SUPERSET_DB_PASSWORD, valueFrom: { secretKeyRef: { name: observability-db, key: SUPERSET_DB_PASSWORD } } }
  - { name: REDIS_HOST, value: "${REDIS_HOST}" }
  - { name: BACKOFFICE_ORIGIN, value: "https://backoffice.loyalty.example.it" }
  - { name: SUPERSET_FORCE_HTTPS, value: "true" }
  - { name: CLICKHOUSE_HOST, value: clickhouse-loyalty.analytics }
postgresql: { enabled: false }
redis: { enabled: false }
supersetNode:
  replicas: { enabled: true, replicaCount: 2 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
supersetWorker:
  replicas: { enabled: true, replicaCount: 2 }
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
supersetCeleryBeat: { enabled: true }
supersetCeleryFlower: { enabled: false }
init:
  enabled: true
  createAdmin: true
  adminUser: { username: admin, email: loyalty-admin@example.com }
  initscript: |
    #!/bin/sh
    sh /app/dashboards/init.sh
extraVolumes:
  - { name: dashboards, configMap: { name: superset-dashboards } }    # kubectl create configmap superset-dashboards --from-file=analytics/superset/
extraVolumeMounts:
  - { name: dashboards, mountPath: /app/dashboards }
ingress:
  enabled: true
  ingressClassName: alb
  hosts: [bi.loyalty.example.it]
serviceAccount: { create: true, annotations: { "eks.amazonaws.com/role-arn": "${OBSERVABILITY_ROLE_ARN}" } }
