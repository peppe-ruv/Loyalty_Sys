# Overlay della vetrina enterprise in un GitHub Codespace acceso su richiesta (F2-DIST-09, ADR-050, M8.14 V7, Q-661).
#
# Si usa SOLO dopo deploy/compose/reference.yml e deploy/vetrina/compose.vetrina.yml e SOLO tramite
# `deploy/vetrina/vetrina.sh` con LH_VETRINA_MODE=codespace (lo scrive `vetrina.sh codespace`, avviato dal dev container
# .devcontainer/vetrina). Runbook: deploy/vetrina/README.md, sezione «Vetrina in un codespace».
#
# Cosa cambia rispetto all'host fisso (ADR-049):
# - niente IP pubblico né ACME: il TLS lo termina l'inoltro delle porte di GitHub su
#   https://<codespace>-<porta>.<dominio di inoltro>. Il proxy resta, ma in HTTP su due porte di loopback, 8000 (web) e
#   8001 (Keycloak), rese pubbliche nel codespace: tiene la console /admin e il realm `master` fuori portata (404) e le
#   intestazioni di sicurezza, come sull'host fisso;
# - niente alias di rete: i nomi pubblici puntano a GitHub, non al proxy. Web e hub raggiungono l'emittente con lo
#   stesso URL del browser, passando dall'inoltro delle porte (Q-420), con un certificato pubblico verificato;
# - la console di Keycloak ha un indirizzo proprio sulla porta 8180 privata (solo il proprietario del codespace);
# - tutto il resto (TLS verso bus e database con la CA locale, segreti da file, profilo fisso) resta identico.
services:
  proxy:
    # HTTP in chiaro solo verso l'inoltro delle porte del codespace, su porte non privilegiate. NET_BIND_SERVICE resta
    # nell'insieme limite dell'overlay: il binario caddy ha la file capability cap_net_bind_service e senza il kernel ne
    # rifiuta l'esecuzione ("exec /usr/bin/caddy: operation not permitted", visto nello smoke enterprise in CI).
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes: !override
      - ../vetrina/caddy/Caddyfile.codespace:/etc/caddy/Caddyfile:ro
      - lh-vetrina-caddy-data:/data
      - lh-vetrina-caddy-config:/config
    networks: !override
      default: {}

  # Console di Keycloak (/admin e realm `master`) sull'inoltro PRIVATO della porta 8180: solo il proprietario del
  # codespace, autenticato da GitHub, poi con l'utente admin di Keycloak. Senza questo indirizzo la console rimanderebbe
  # a http://127.0.0.1:8180 (quello dell'host fisso), irraggiungibile dal browser. La porta resta privata: avvio.sh
  # rende pubbliche solo 8000 e 8001, e il proxy pubblico continua a rispondere 404 su /admin.
  idp:
    environment:
      KC_HOSTNAME_ADMIN: "https://${LH_VETRINA_ADMIN_HOST:?LH_VETRINA_ADMIN_HOST obbligatoria nel codespace}"
  # Utenti di test (Q-676, ADR-051): ammessi solo con LH_TEST_USERS_ALLOWED=true e LH_ENVIRONMENT=test, che vetrina.sh
  # passa solo dentro un GitHub Codespace (CODESPACES=true); vuote altrove, e un utente con LH_TEST_USER è rifiutato.
  # Solo questo overlay le dichiara: né il compose di riferimento né il chart.
  # Healthcheck con Node: l'immagine su base Wolfi non ha l'applet wget usato da /opt/lh/healthcheck.sh.
  hub:
    environment:
      LH_TEST_USERS_ALLOWED: "${LH_TEST_USERS_ALLOWED:-}"
      LH_ENVIRONMENT: "${LH_ENVIRONMENT:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/actuator/health').then(r=>r.text()).then(t=>process.exit(t.includes('\"status\":\"UP\"')?0:1),()=>process.exit(1))"]
  web:
    environment:
      LH_TEST_USERS_ALLOWED: "${LH_TEST_USERS_ALLOWED:-}"
      LH_ENVIRONMENT: "${LH_ENVIRONMENT:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/demo/status').then(r=>r.text()).then(t=>process.exit(t.includes('checkedAt')?0:1),()=>process.exit(1))"]
