# Client del controllo di salute di Kafka nella vetrina (F2-DIST-09, ADR-049, Q-621): stesso listener SSL dell'hub,
# con il certificato del broker come certificato client (estensione clientAuth) e la CA locale come truststore.
# Solo percorsi, nessun segreto: i file sono i secret di compose montati in /run/secrets.
security.protocol=SSL
ssl.truststore.type=PEM
ssl.truststore.location=/run/secrets/lh_tls_ca
ssl.keystore.type=PEM
ssl.keystore.location=/run/secrets/lh_kafka_tls_keystore
