# Overlay della vetrina enterprise ospitata sul compose di riferimento (F2-DIST-03, F2-DIST-09, ADR-049, ADR-050, M8.14 V3).
#
# Si usa SOLO insieme a deploy/compose/reference.yml e SOLO tramite deploy/vetrina/vetrina.sh, che legge la
# configurazione, genera segreti e certificati e fa i controlli preliminari (runbook: deploy/vetrina/README.md). Gira solo
# in un GitHub Codespace (ADR-050, ADR-051 decisione 5), insieme a deploy/vetrina/compose.codespace.yml:
#   deploy/vetrina/vetrina.sh codespace
# I percorsi relativi valgono dalla cartella del primo file (deploy/compose), come nel compose di riferimento.
#
# Cosa aggiunge al compose di riferimento:
# - `proxy`: reverse proxy HTTP dietro l'inoltro delle porte del codespace (ADR-050, Q-661), che termina il TLS.
#   È l'unico componente nuovo, dichiarato solo qui (regola 8-bis, ADR-049) e l'unico con porte pubblicate nel
#   codespace (8000 e 8001, solo su loopback).
# - TLS verso bus e database con una CA locale generata sull'host (Q-621): Kafka con un listener SSL e autenticazione
#   del client (KAFKA_SECURITY=SSL_PEM nell'hub), Postgres che accetta solo connessioni TLS (pg_hba `hostssl`) e client
#   con sslmode=verify-full (più stretto di `require`: verifica anche nome e CA). Nessuna eccezione di vetrina alla
#   regola 22: un DB_URL senza verify-full o un Kafka non SSL_PEM fermano il container (guardia sotto, SPEC-GAP: Q-631).
# - Segreti solo da file (regola 20): ogni segreto arriva come <VAR>_FILE da /run/secrets (secret di compose, file
#   dell'host con permessi 0600), la variabile in chiaro è forzata a vuoto e il container si ferma se la trova piena.
#   Nessun valore in questo file, nei log o negli argomenti dei processi.
# - Profilo fisso: LH_PROFILE=enterprise e LH_IDENTITY_MODE=oidc, senza telemetria in uscita (ADR-044).
# - Rete: web e idp restano su 127.0.0.1 (LH_BIND_ADDRESS, imposto da vetrina.sh); hub su 127.0.0.1:8080 solo per lo
#   script del programma (scripts/vetrina-programma.mjs); Postgres e Kafka solo sulla rete interna.
# Non è HA (un codespace, un broker, un Postgres, una replica del web) e si azzera senza backup (Q-624).
name: loyaltyhub-vetrina

# Segreti da file e guardie di trasporto (POSIX sh con soli builtin: vale per l'immagine unica, Keycloak e Postgres).
# - LH_SECRET_FILE_ENV: variabili da leggere da <VAR>_FILE. La variabile deve essere vuota (altrimenti è un segreto in
#   chiaro nell'ambiente: errore), il file deve esistere ed essere non vuoto; dopo la lettura <VAR>_FILE si toglie
#   dall'ambiente (l'entrypoint di Postgres rifiuta POSTGRES_PASSWORD e POSTGRES_PASSWORD_FILE insieme).
# - LH_VETRINA_REQUIRE_DB_TLS: variabili con un URL JDBC che deve contenere sslmode=verify-full (Q-621).
# - LH_VETRINA_REQUIRE_KAFKA_TLS: se valorizzata, KAFKA_SECURITY deve essere SSL_PEM (Q-621).
# - LH_REQUIRED_ENV: come x-lh-require-env del compose di riferimento, dopo la lettura dei file.
# Il valore di un segreto non viene mai stampato: i messaggi nominano solo la variabile.
x-lh-vetrina-env: &lh-vetrina-env
  - /bin/sh
  - -c
  - |
    for v in $${LH_SECRET_FILE_ENV:-}; do
      eval "cur=\$${$$v:-}"
      if [ -n "$$cur" ]; then echo "Segreto in chiaro nell'ambiente: $$v (nella vetrina solo $${v}_FILE, regola 20)" >&2; exit 1; fi
      eval "f=\$${$${v}_FILE:-}"
      if [ -z "$$f" ] || [ ! -r "$$f" ]; then echo "File del segreto mancante o non leggibile: $${v}_FILE (deploy/vetrina/vetrina.sh provision)" >&2; exit 1; fi
      val=""
      IFS= read -r val < "$$f" || :
      if [ -z "$$val" ]; then echo "File del segreto vuoto: $${v}_FILE" >&2; exit 1; fi
      export "$$v=$$val"
      unset "$${v}_FILE"
    done
    unset val cur f
    for u in $${LH_VETRINA_REQUIRE_DB_TLS:-}; do
      url=""
      eval "url=\$${$$u:-}"
      case "$$url" in
        jdbc:postgresql://*sslmode=verify-full*) ;;
        *) echo "INSECURE_CONFIG: $$u senza sslmode=verify-full, TLS verso il database obbligatorio nella vetrina (Q-621)" >&2; exit 1 ;;
      esac
    done
    if [ -n "$${LH_VETRINA_REQUIRE_KAFKA_TLS:-}" ] && [ "$${KAFKA_SECURITY:-}" != "SSL_PEM" ]; then
      echo "INSECURE_CONFIG: KAFKA_SECURITY deve essere SSL_PEM, TLS verso il bus obbligatorio nella vetrina (Q-621)" >&2; exit 1
    fi
    for v in $${LH_REQUIRED_ENV:-}; do
      eval "val=\$${$$v:-}"
      if [ -z "$$val" ]; then echo "Variabile obbligatoria mancante: $$v" >&2; exit 1; fi
    done
    unset val
    exec "$$@"

services:
  # ---------- Reverse proxy della vetrina (ADR-050): unico componente nuovo, unico esposto ----------
  # Nel codespace il TLS lo termina l'inoltro delle porte di GitHub: il proxy resta in HTTP su due porte di loopback,
  # 8000 (web) e 8001 (Keycloak), rese pubbliche nel codespace. Apre solo i due realm di vetrina e le loro console
  # (`master` chiuso con 404, aperto solo con il segreto del proprietario: ADR-055) e aggiunge le intestazioni di sicurezza (caddy/Caddyfile.codespace). NET_BIND_SERVICE resta
  # nell'insieme limite: il binario caddy ha la file capability cap_net_bind_service e senza il kernel ne rifiuta
  # l'esecuzione ("exec /usr/bin/caddy: operation not permitted", visto nello smoke enterprise in CI).
  # Niente alias di rete: i nomi pubblici puntano a GitHub, non al proxy. Web e hub raggiungono l'emittente con lo
  # stesso URL del browser, passando dall'inoltro delle porte (Q-420), con un certificato pubblico verificato.
  # Senza healthcheck: l'API di amministrazione è spenta (`admin off`) e lo stato si vede da `ps` e dai log.
  proxy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      LH_VETRINA_WEB_HOST: "${LH_VETRINA_WEB_HOST:?LH_VETRINA_WEB_HOST obbligatoria}"
      LH_VETRINA_IDP_HOST: "${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}"
    volumes:
      - ../vetrina/caddy/Caddyfile.codespace:/etc/caddy/Caddyfile:ro
      # Cartella, non un file singolo: vetrina.sh sostituisce master-console.caddy con un rename e un file singolo
      # resterebbe legato al vecchio inode. Contiene il solo permesso (o il vuoto) per la console master (ADR-055, Q-727).
      - "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/caddy:/etc/caddy/vetrina:ro"
      - lh-vetrina-caddy-data:/data
      - lh-vetrina-caddy-config:/config
    mem_limit: 128m
    cpus: 0.5

  # ---------- Postgres con TLS obbligatorio (Q-621) ----------
  # Solo connessioni TLS dalla rete (pg_hba.conf della vetrina); il socket locale resta per l'inizializzazione e per
  # pg_isready. Chiave del server di proprietà dell'utente postgres dell'immagine (uid 999, vetrina.sh provision).
  postgres:
    entrypoint: *lh-vetrina-env
    command:
      - lh-require-env
      - docker-entrypoint.sh
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/lh_pg_tls_cert
      - -c
      - ssl_key_file=/run/secrets/lh_pg_tls_key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/lh/pg_hba.conf
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/lh_db_password
      LH_IDP_DB_PASSWORD: ""
      LH_IDP_DB_PASSWORD_FILE: /run/secrets/lh_idp_db_password
      LH_SECRET_FILE_ENV: "POSTGRES_PASSWORD LH_IDP_DB_PASSWORD"
    secrets:
      - lh_db_password
      - lh_idp_db_password
      - lh_pg_tls_cert
      - lh_pg_tls_key
    volumes:
      - ../vetrina/postgres/pg_hba.conf:/etc/lh/pg_hba.conf:ro

  # ---------- Kafka con TLS e autenticazione del client (Q-616, Q-621) ----------
  # Listener BROKER in SSL (anche tra broker), con certificato del client obbligatorio; il listener del controller
  # resta in chiaro ma solo su 127.0.0.1 del container. Il nome BROKER (non SSL://) evita il ramo dell'immagine che
  # pretende un keystore JKS con password: qui il keystore è un PEM (chiave PKCS#8 e certificato) e il truststore la CA.
  # Heap a 512 MB: entra nel limite di 1 GB del container.
  kafka:
    environment:
      KAFKA_LISTENERS: "BROKER://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093"
      KAFKA_ADVERTISED_LISTENERS: "BROKER://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,BROKER:SSL"
      KAFKA_INTER_BROKER_LISTENER_NAME: "BROKER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/run/secrets/lh_kafka_tls_keystore"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/run/secrets/lh_tls_ca"
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_ENABLED_PROTOCOLS: "TLSv1.3,TLSv1.2"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    secrets:
      - lh_kafka_tls_keystore
      - lh_tls_ca
    volumes:
      - ../vetrina/kafka/client-ssl.properties:/etc/lh/kafka-client-ssl.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /etc/lh/kafka-client-ssl.properties --list || exit 1"]

  # ---------- Ruoli dell'immagine unica ----------
  migrate:
    entrypoint: *lh-vetrina-env
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?sslmode=verify-full&sslrootcert=/run/secrets/lh_tls_ca"
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      LH_SECRET_FILE_ENV: "DB_PASSWORD"
      LH_VETRINA_REQUIRE_DB_TLS: "DB_URL"
    secrets:
      - lh_db_password
      - lh_tls_ca

  hub:
    entrypoint: *lh-vetrina-env
    # Solo su 127.0.0.1 dell'host: serve a scripts/vetrina-programma.mjs (vetrina.sh programma), mai dal proxy.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LH_PROFILE: "enterprise"
      LH_IDENTITY_MODE: "oidc"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?sslmode=verify-full&sslrootcert=/run/secrets/lh_tls_ca"
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      KAFKA_SECURITY: "SSL_PEM"
      KAFKA_SSL_CA_B64: ""
      KAFKA_SSL_CA_B64_FILE: /run/secrets/lh_kafka_client_ca_b64
      KAFKA_SSL_CERT_B64: ""
      KAFKA_SSL_CERT_B64_FILE: /run/secrets/lh_kafka_client_cert_b64
      KAFKA_SSL_KEY_B64: ""
      KAFKA_SSL_KEY_B64_FILE: /run/secrets/lh_kafka_client_key_b64
      LH_SUBJECT_KEY: ""
      LH_SUBJECT_KEY_FILE: /run/secrets/lh_subject_key
      # Emittente e JWKS con l'URL pubblico https: il JWKS passa dall'inoltro delle porte del codespace con
      # un certificato pubblico, non in chiaro sulla rete interna.
      LH_OIDC_ISSUER: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub"
      LH_OIDC_JWKS_URI: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub/protocol/openid-connect/certs"
      # Realm dei membri (ADR-051), con lo stesso giro dal proxy.
      LH_OIDC_MEMBER_ISSUER: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub-members"
      LH_OIDC_MEMBER_JWKS_URI: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub-members/protocol/openid-connect/certs"
      LH_OTEL_METRICS_ENABLED: "false"
      LH_SECRET_FILE_ENV: "DB_PASSWORD LH_SUBJECT_KEY KAFKA_SSL_CA_B64 KAFKA_SSL_CERT_B64 KAFKA_SSL_KEY_B64"
      LH_VETRINA_REQUIRE_DB_TLS: "DB_URL"
      LH_VETRINA_REQUIRE_KAFKA_TLS: "true"
    secrets:
      - lh_db_password
      - lh_subject_key
      - lh_tls_ca
      - lh_kafka_client_ca_b64
      - lh_kafka_client_cert_b64
      - lh_kafka_client_key_b64

  # Il web legge da sé <VAR>_FILE (entrypoint dell'immagine) e, nel profilo enterprise, si ferma con INSECURE_CONFIG
  # se un segreto manca o non è valido; la guardia x-lh-web-oidc-guard del riferimento resta.
  web:
    environment:
      LH_PROFILE: "enterprise"
      LH_OIDC_ISSUER: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub"
      LH_WEB_URL: "https://${LH_VETRINA_WEB_HOST:?LH_VETRINA_WEB_HOST obbligatoria}"
      LH_WEB_CLIENT_SECRET: ""
      LH_WEB_CLIENT_SECRET_FILE: /run/secrets/lh_web_client_secret
      LH_OIDC_MEMBER_ISSUER: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}/realms/loyaltyhub-members"
      LH_WEB_MEMBER_CLIENT_SECRET: ""
      LH_WEB_MEMBER_CLIENT_SECRET_FILE: /run/secrets/lh_portal_client_secret
      LH_WEB_SESSION_KEY: ""
      LH_WEB_SESSION_KEY_FILE: /run/secrets/lh_web_session_key
      # Collegamento di ritorno alla demo in HUB-02 (ADR-049, docs/11 §8); vuota = nessun collegamento.
      LH_HUB_DEMO_URL: "${LH_HUB_DEMO_URL:-}"
    secrets:
      - lh_web_client_secret
      - lh_portal_client_secret
      - lh_web_session_key

  # Keycloak: database con TLS verificato, porta di amministrazione 127.0.0.1:8180 solo per gli script dell'host
  # (nel codespace non e' inoltrata); la console del realm `master` sta sull'indirizzo pubblico e la apre il proxy solo
  # con il segreto del proprietario (ADR-055); realm reimportato a ogni azzeramento e a ogni avvio.
  idp:
    entrypoint: *lh-vetrina-env
    environment:
      KC_DB_URL: "jdbc:postgresql://postgres:5432/idp?sslmode=verify-full&sslrootcert=/run/secrets/lh_tls_ca"
      KC_DB_PASSWORD: ""
      KC_DB_PASSWORD_FILE: /run/secrets/lh_idp_db_password
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/lh_idp_admin_password
      KC_HOSTNAME: "https://${LH_VETRINA_IDP_HOST:?LH_VETRINA_IDP_HOST obbligatoria}"
      KC_HOSTNAME_ADMIN: "http://127.0.0.1:8180"
      LH_WEB_URL: "https://${LH_VETRINA_WEB_HOST:?LH_VETRINA_WEB_HOST obbligatoria}"
      LH_WEB_CLIENT_SECRET: ""
      LH_WEB_CLIENT_SECRET_FILE: /run/secrets/lh_web_client_secret
      LH_PORTAL_CLIENT_SECRET: ""
      LH_PORTAL_CLIENT_SECRET_FILE: /run/secrets/lh_portal_client_secret
      LH_WIDGETS_CLIENT_SECRET: ""
      LH_WIDGETS_CLIENT_SECRET_FILE: /run/secrets/lh_widgets_client_secret
      LH_CMS_CLIENT_SECRET: ""
      LH_CMS_CLIENT_SECRET_FILE: /run/secrets/lh_cms_client_secret
      LH_SECRET_FILE_ENV: "KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD LH_WEB_CLIENT_SECRET LH_PORTAL_CLIENT_SECRET LH_WIDGETS_CLIENT_SECRET LH_CMS_CLIENT_SECRET"
      LH_VETRINA_REQUIRE_DB_TLS: "KC_DB_URL"
    secrets:
      - lh_tls_ca
      - lh_idp_db_password
      - lh_idp_admin_password
      - lh_web_client_secret
      - lh_portal_client_secret
      - lh_widgets_client_secret
      - lh_cms_client_secret

# File dell'host creati da `vetrina.sh provision` (permessi 0600, mai nel repository). Compose li monta in sola
# lettura in /run/secrets/<nome>; proprietario e permessi restano quelli dell'host.
secrets:
  lh_db_password:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/db-password"
  lh_idp_db_password:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/idp-db-password"
  lh_idp_admin_password:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/idp-admin-password"
  lh_web_client_secret:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/web-client-secret"
  lh_portal_client_secret:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/portal-client-secret"
  lh_widgets_client_secret:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/widgets-client-secret"
  lh_cms_client_secret:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/cms-client-secret"
  lh_web_session_key:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/web-session-key"
  lh_subject_key:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/secrets/subject-key"
  lh_tls_ca:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/ca.crt"
  lh_pg_tls_cert:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/postgres.crt"
  lh_pg_tls_key:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/postgres.key"
  lh_kafka_tls_keystore:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/kafka-keystore.pem"
  lh_kafka_client_ca_b64:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/kafka-client-ca.b64"
  lh_kafka_client_cert_b64:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/kafka-client-cert.b64"
  lh_kafka_client_key_b64:
    file: "${LH_VETRINA_DIR:?LH_VETRINA_DIR obbligatoria}/tls/kafka-client-key.b64"

volumes:
  lh-vetrina-caddy-data:
  lh-vetrina-caddy-config:
