# Accessi a Postgres della vetrina enterprise (F2-DIST-09, ADR-049, Q-621). Usato con `-c hba_file=` dal servizio
# postgres di deploy/vetrina/compose.vetrina.yml.
# - socket locale del container: inizializzazione del volume (docker-entrypoint-initdb.d) e pg_isready, come
#   nell'immagine ufficiale; non è raggiungibile da altri container;
# - dalla rete: solo TLS (hostssl) con password SCRAM; ogni connessione in chiaro è rifiutata.
# TYPE     DATABASE  USER  ADDRESS      METHOD
local      all       all                trust
hostssl    all       all   0.0.0.0/0    scram-sha-256
hostssl    all       all   ::/0         scram-sha-256
hostnossl  all       all   0.0.0.0/0    reject
hostnossl  all       all   ::/0         reject
