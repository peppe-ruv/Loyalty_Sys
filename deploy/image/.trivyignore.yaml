# Vulnerabilita' accettate per l'immagine unica (F2-SEC-03, ADR-038, ADR-044, docs/security/supply-chain.md).
# Lette solo da .github/workflows/image.yml (`trivy image --ignorefile`); il file del repository (.trivyignore*)
# e' di altri controlli e non si usa qui.
#
# Regole per ogni voce:
#   - `id`: identificativo della vulnerabilita' (CVE-…, GHSA-…); `paths` o `purls` limitano l'esenzione
#     al pacchetto interessato quando l'id compare altrove;
#   - `statement`: motivo, riferimento (Q-nnn in docs/15 o TOBE-nnn in docs/19) e condizione per toglierla;
#   - `expired_at`: data di scadenza, al massimo 90 giorni da quando la voce e' scritta o rinnovata.
#     Alla scadenza Trivy smette di ignorare la voce e la scansione torna a fallire: si corregge,
#     oppure si rinnova con una nuova decisione del proprietario (Q in docs/15), mai in silenzio.
# Si accetta solo cio' che ha una correzione disponibile e non si puo' applicare subito; le vulnerabilita'
# senza correzione (`--ignore-unfixed`) non vanno elencate. Le librerie di Keycloak (Q-482, TOBE-007) e
# OpenLDAP di prova (Q-480) non sono in questa immagine: stanno nelle loro immagini di terze parti.
#
# Esempio (non attivo):
#   - id: CVE-2099-0001
#     paths:
#       - opt/lh/hub/hub.jar
#     statement: 'Motivo e sfruttabilita'. Q-5nn. Si toglie con la patch X.'
#     expired_at: 2026-12-28

vulnerabilities: []
