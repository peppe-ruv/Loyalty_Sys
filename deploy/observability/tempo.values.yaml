# Grafana Tempo (grafana/tempo-distributed): tracce OTLP dei servizi su S3, 14 giorni, metriche RED derivate (service map).
storage:
  trace:
    backend: s3
    s3: { bucket: "${TEMPO_BUCKET}", region: eu-south-1, endpoint: s3.eu-south-1.amazonaws.com }
traces: { otlp: { grpc: { enabled: true }, http: { enabled: true } } }
distributor: { replicas: 2 }
ingester: { replicas: 3, persistence: { enabled: true, size: 10Gi } }
querier: { replicas: 2 }
queryFrontend: { replicas: 2 }
compactor: { config: { compaction: { block_retention: 336h } } }
metricsGenerator:
  enabled: true
  config: { storage: { remote_write: [{ url: http://monitoring-prometheus.observability:9090/api/v1/write }] } }
serviceAccount:
  annotations: { "eks.amazonaws.com/role-arn": "${OBSERVABILITY_ROLE_ARN}" }
metaMonitoring: { serviceMonitor: { enabled: true } }
