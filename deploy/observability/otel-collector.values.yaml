# OpenTelemetry Collector (open-telemetry/opentelemetry-collector): un solo punto d'ingresso OTLP per tracce, metriche e log dei servizi;
# DaemonSet per i log dei container, Deployment (2 repliche) per OTLP dai servizi. Questo file è il Deployment.
mode: deployment
replicaCount: 2
image: { repository: otel/opentelemetry-collector-contrib }
presets: { kubernetesAttributes: { enabled: true } }
config:
  receivers:
    otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
  processors:
    batch: { timeout: 5s, send_batch_size: 1024 }
    memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 20 }
    resource: { attributes: [{ key: deployment.environment, value: "${ENVIRONMENT}", action: upsert }] }
    attributes/pii:                          # niente dati personali nei segnali (GDPR): l'id membro resta solo come hash nei trace, mai nei log
      actions: [{ key: member.id, action: hash }, { key: http.request.header.authorization, action: delete }]
  exporters:
    otlp/tempo: { endpoint: tempo-distributor.observability:4317, tls: { insecure: true } }
    otlphttp/loki: { endpoint: http://loki-gateway.observability/otlp }
    prometheusremotewrite: { endpoint: http://monitoring-prometheus.observability:9090/api/v1/write, resource_to_telemetry_conversion: { enabled: true } }
  service:
    pipelines:
      traces: { receivers: [otlp], processors: [memory_limiter, resource, attributes/pii, batch], exporters: [otlp/tempo] }
      logs: { receivers: [otlp], processors: [memory_limiter, resource, attributes/pii, batch], exporters: [otlphttp/loki] }
      metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheusremotewrite] }
ports: { otlp: { enabled: true }, otlp-http: { enabled: true } }
resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
podDisruptionBudget: { enabled: true, minAvailable: 1 }
serviceMonitor: { enabled: true }
