# kubectl apply -k deploy/observability/dashboards  → ConfigMap per dashboard, raccolte dal sidecar Grafana (label grafana_dashboard=1)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
commonLabels: { grafana_dashboard: "1" }
commonAnnotations: { grafana_folder: "Loyalty Hub" }
configMapGenerator:
  - { name: dashboard-loyalty-platform, files: [loyalty-platform.json] }
  - { name: dashboard-loyalty-business, files: [loyalty-business.json] }
  - { name: dashboard-loyalty-contests, files: [loyalty-contests.json] }
generatorOptions: { disableNameSuffixHash: true }
