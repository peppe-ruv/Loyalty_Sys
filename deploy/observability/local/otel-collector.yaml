receivers:
  otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
processors:
  batch: {}
  attributes/pii: { actions: [{ key: member.id, action: hash }] }
exporters:
  otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
  otlphttp/loki: { endpoint: http://loki:3100/otlp }
  debug: { verbosity: basic }
service:
  telemetry: { metrics: { level: basic } }
  pipelines:
    traces: { receivers: [otlp], processors: [attributes/pii, batch], exporters: [otlp/tempo] }
    logs: { receivers: [otlp], processors: [attributes/pii, batch], exporters: [otlphttp/loki] }
