# Grafana Loki (grafana/loki) in modalità "simple scalable" su S3: log strutturati ECS di tutti i pod, 30 giorni (RF-118).
deploymentMode: SimpleScalable
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 3 }
  storage:
    type: s3
    bucketNames: { chunks: "${LOKI_BUCKET}", ruler: "${LOKI_BUCKET}", admin: "${LOKI_BUCKET}" }
    s3: { region: eu-south-1 }
  schemaConfig:
    configs:
      - { from: "2026-01-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: loki_index_, period: 24h } }
  limits_config: { retention_period: 720h, ingestion_rate_mb: 20, ingestion_burst_size_mb: 40 }
  compactor: { retention_enabled: true, delete_request_store: s3 }
backend: { replicas: 3, persistence: { size: 10Gi } }
read: { replicas: 3 }
write: { replicas: 3, persistence: { size: 20Gi } }
gateway: { enabled: true, replicas: 2 }
serviceAccount:
  annotations: { "eks.amazonaws.com/role-arn": "${OBSERVABILITY_ROLE_ARN}" }   # IRSA: accesso al bucket senza chiavi
monitoring: { serviceMonitor: { enabled: true } }
