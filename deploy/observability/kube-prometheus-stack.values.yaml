# Stack di monitoraggio (RF-117..RF-120): kube-prometheus-stack (Prometheus Operator) in alta affidabilità.
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack -n observability -f questo-file
fullnameOverride: monitoring
prometheus:
  prometheusSpec:
    replicas: 2                              # due repliche identiche: nessuna perdita di scrape a un riavvio
    retention: 15d
    retentionSize: 45GB
    walCompression: true
    podAntiAffinity: hard
    storageSpec:
      volumeClaimTemplate: { spec: { storageClassName: gp3, resources: { requests: { storage: 50Gi } } } }
    resources: { requests: { cpu: "1", memory: 4Gi }, limits: { memory: 8Gi } }
    serviceMonitorSelectorNilUsesHelmValues: false   # raccoglie tutti i ServiceMonitor/PodMonitor del cluster
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    externalLabels: { cluster: loyalty-hub, region: eu-south-1 }
    # Thanos sidecar: upload dei blocchi su S3 per retention lunga (13 mesi) e query deduplicata tra le due repliche
    thanos:
      objectStorageConfig:
        existingSecret: { name: thanos-objstore, key: objstore.yml }
    additionalScrapeConfigs:
      - job_name: loyalty-pods
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [loyalty] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], target_label: __metrics_path__, regex: (.+) }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], target_label: service }
  thanosService: { enabled: true }
  thanosServiceMonitor: { enabled: true }
alertmanager:
  alertmanagerSpec:
    replicas: 3                              # cluster gossip: nessun alert perso con una replica giù
    podAntiAffinity: hard
    retention: 120h
    storage: { volumeClaimTemplate: { spec: { storageClassName: gp3, resources: { requests: { storage: 5Gi } } } } }
  config:
    global: { resolve_timeout: 5m }
    route:
      receiver: oncall
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - { matchers: ['severity="page"'], receiver: oncall, continue: true }
        - { matchers: ['team="legal-contest"'], receiver: contest-legal }
        - { matchers: ['severity="ticket"'], receiver: ticket }
    receivers:
      - name: oncall
        webhook_configs: [{ url: "http://oncall-bridge.observability/alert", send_resolved: true }]   # Opsgenie/PagerDuty/Teams tramite bridge
      - name: contest-legal
        email_configs: [{ to: "legal-contests@example.com", send_resolved: true }]
      - name: ticket
        webhook_configs: [{ url: "http://itsm-bridge.observability/ticket" }]
grafana:
  replicas: 2                                # HA: sessioni e dashboard su Postgres (RDS), niente sqlite
  deploymentStrategy: { type: RollingUpdate }
  envFromSecret: grafana-db                  # GF_DATABASE_* dal secret
  grafana.ini:
    server: { root_url: "https://monitoring.loyalty.example.it" }
    database: { type: postgres, host: "$__env{GF_DATABASE_HOST}", name: grafana, user: "$__env{GF_DATABASE_USER}", password: "$__env{GF_DATABASE_PASSWORD}", ssl_mode: require }
    auth.generic_oauth:                      # SSO aziendale (RF-43)
      enabled: true
      name: SSO aziendale
      auth_url: https://iam.example.it/oauth2/authorize
      token_url: https://iam.example.it/oauth2/token
      api_url: https://iam.example.it/oauth2/userinfo
      scopes: openid profile email
      role_attribute_path: "contains(groups[*], 'loyalty-platform-admin') && 'Admin' || contains(groups[*], 'loyalty-ops') && 'Editor' || 'Viewer'"
    unified_alerting: { enabled: true }
    analytics: { reporting_enabled: false }
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, folderAnnotation: grafana_folder, provider: { foldersFromFilesStructure: true } }
    datasources: { enabled: true }
  additionalDataSources:
    - { name: Thanos, type: prometheus, url: http://monitoring-thanos-query.observability:9090, isDefault: true, jsonData: { timeInterval: 30s } }
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.observability
      jsonData:
        derivedFields:
          - { name: TraceID, matcherRegex: '"trace.id":"(\\w+)"', url: "$${__value.raw}", datasourceUid: tempo }
    - { name: Tempo, type: tempo, uid: tempo, url: http://tempo-query-frontend.observability:3200, jsonData: { tracesToLogsV2: { datasourceUid: loki }, serviceMap: { datasourceUid: thanos } } }
    - { name: ClickHouse, type: grafana-clickhouse-datasource, url: http://clickhouse.analytics:8123, jsonData: { defaultDatabase: loyalty } }
  plugins: [grafana-clickhouse-datasource]
kubeStateMetrics: { enabled: true }
nodeExporter: { enabled: true }
prometheusOperator:
  admissionWebhooks: { enabled: true }
defaultRules:
  create: true
  rules: { etcd: false }                     # EKS: control plane gestito
