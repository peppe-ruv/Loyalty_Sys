# Compose di riferimento del profilo enterprise (F2-DIST-03, M8.3; docs/18 §3.1, ADR-037).
#
# Un container per ruolo dell'immagine unica (LH_ROLE=hub, web) più l'infrastruttura open source: Postgres 17 e
# Kafka KRaft. Stessa immagine del chart Helm (deploy/helm/loyaltyhub) e dell'appliance; LH_MODE=external.
# Non è HA (un broker, un Postgres): è il taglio per chi installa su Docker senza Kubernetes.
#
#   export LH_IMAGE=ghcr.io/<owner>/loyaltyhub:<versione>
#   export LH_DB_PASSWORD=… LH_IDP_DB_PASSWORD=… LH_IDP_ADMIN_PASSWORD=…
#   export LH_WEB_CLIENT_SECRET=… LH_WIDGETS_CLIENT_SECRET=… LH_CMS_CLIENT_SECRET=…
#   export LH_WEB_SESSION_KEY="$(openssl rand -base64 32)"
#   export LH_WEB_URL=https://loyalty.example.org LH_IDP_PUBLIC_URL=https://idp.example.org
#   docker compose -f deploy/compose/reference.yml up -d
#
# Immagine: LH_IMAGE è obbligatoria (nessun default: un nome inventato non si scaricherebbe). La pipeline
# .github/workflows/image.yml pubblica ghcr.io/<owner>/loyaltyhub solo sui tag git `v*`.
# Segreti: nessun valore nel file. Le variabili hanno default vuoto; a runtime il container che ne ha bisogno rifiuta
# di partire (x-lh-require-env, Postgres senza password o senza LH_IDP_DB_PASSWORD, il web con INSECURE_CONFIG).
# Rete: web e idp ascoltano solo su 127.0.0.1 dell'host (LH_BIND_ADDRESS) e parlano HTTP in chiaro: davanti serve un
# reverse proxy con TLS (SPEC-GAP: Q-392, TLS end-to-end con M8.5). Variabili e scelte: deploy/README.md.
# Login nel profilo enterprise (BFF OIDC, F2-SEC-06): il web chiama Keycloak con l'URL pubblico, lo stesso del browser,
# e accetta solo https fuori da localhost; dentro il container web `localhost` è il container stesso. Quindi
# LH_IDP_PUBLIC_URL (e LH_WEB_URL) sono gli URL https del reverse proxy, raggiungibili anche dai container web e idp
# (SPEC-GAP: Q-420). Con i default in http il web non parte nel profilo enterprise (x-lh-web-oidc-guard).
#
# Ruolo idp: immagine ufficiale di Keycloak alla versione di deploy/docker-compose.yml finché l'immagine unica non
# contiene Keycloak (SPEC-GAP: Q-374). Ruolo cms (Directus) con Redis e MinIO: arrivano con M10.2 (Q-374).
# Per valutare con i dati fittizi senza reverse proxy: LH_PROFILE=demo LH_IDENTITY_MODE=header.
#
# Osservabilità (F2-OBS-01, M8.6a; profilo `observability`, spento di default): collector OpenTelemetry, Prometheus 3 e
# Grafana con la dashboard SLO e le regole del chart (deploy/helm/loyaltyhub/files/observability, un solo file per i due).
# Variabili: LH_OTEL_METRICS_ENABLED (true perché l'hub invii le metriche), LH_GRAFANA_ADMIN_PASSWORD (obbligatoria),
# LH_GRAFANA_ADMIN_USER (default admin), LH_PROMETHEUS_RETENTION (default 15d). Grafana su http://127.0.0.1:3001.
#   LH_OTEL_METRICS_ENABLED=true LH_GRAFANA_ADMIN_PASSWORD=… docker compose -f deploy/compose/reference.yml --profile observability up -d
name: loyaltyhub-reference

# Guardia dei segreti obbligatori (POSIX sh, vale per l'immagine unica e per Keycloak). Il valore non viene stampato.
# Solo la variabile stessa: né Keycloak né il comando di migrazione (che non passa dall'entrypoint) leggono *_FILE.
x-lh-require-env: &lh-require-env
  - /bin/sh
  - -c
  - |
    for v in $$LH_REQUIRED_ENV; do
      eval "val=\$${$$v:-}"
      if [ -z "$$val" ]; then echo "Variabile obbligatoria mancante: $$v" >&2; exit 1; fi
    done
    exec "$$@"

# Come sopra, ma accetta anche <VAR>_FILE: solo per i ruoli che partono da /opt/lh/entrypoint.sh, che legge la
# convenzione *_FILE (una variabile vuota non oscura il file: deploy/image/README.md).
x-lh-require-env-or-file: &lh-require-env-or-file
  - /bin/sh
  - -c
  - |
    for v in $$LH_REQUIRED_ENV; do
      eval "val=\$${$$v:-}\$${$${v}_FILE:-}"
      if [ -z "$$val" ]; then echo "Variabile obbligatoria mancante: $$v (o $${v}_FILE)" >&2; exit 1; fi
    done
    exec "$$@"

# Guardia del ruolo web nel profilo enterprise (regola 22, Q-420): il BFF fa discovery, scambio del codice e rinnovo
# verso LH_OIDC_ISSUER, lo stesso URL del browser. Il web ammette http solo verso localhost, che dal container non è
# Keycloak: senza https il login non potrebbe funzionare, quindi il container si ferma subito con la causa. Forma
# esatta: l'emittente è https://<host>[:porta]/realms/<realm> e LH_WEB_URL un'origine https senza percorso né barra
# finale, perché Keycloak confronta alla lettera ${LH_WEB_URL}/api/auth/callback e il suo emittente (una barra in più
# darebbe `//`). Segreti e formato della chiave li verifica il web stesso all'avvio (INSECURE_CONFIG, anche con
# <VAR>_FILE). Solo builtin di sh: nessun comando esterno nell'immagine.
x-lh-web-oidc-guard: &lh-web-oidc-guard
  - /bin/sh
  - -c
  - |
    if [ "$${LH_PROFILE:-}" = "enterprise" ]; then
      ko=0
      iss="$${LH_OIDC_ISSUER:-}"; rest="$${iss#https://}"; host="$${rest%%/*}"; path="$${rest#"$$host"}"
      bad=0
      case "$$iss" in https://?*) ;; *) bad=1 ;; esac
      case "$$host" in ''|*[!A-Za-z0-9.:-]*) bad=1 ;; esac
      # Tolto /realms/ resta il solo nome del realm: ogni altra forma (`//`, percorso, barra finale) lascia una barra.
      case "$${path#/realms/}" in ''|*[!A-Za-z0-9_-]*) bad=1 ;; esac
      if [ "$$bad" = 1 ]; then
        echo "LH_IDP_PUBLIC_URL deve essere l'URL https del reverse proxy davanti a Keycloak, senza percorso né barra finale, raggiungibile anche dal container web: l'emittente deve valere https://<host>[:porta]/realms/<realm> (attuale: $${iss:-assente}; deploy/README.md, Q-420)" >&2
        ko=1
      fi
      web="$${LH_WEB_URL:-}"; bad=0
      case "$$web" in https://?*) ;; *) bad=1 ;; esac
      case "$${web#https://}" in ''|*[!A-Za-z0-9.:-]*) bad=1 ;; esac
      if [ "$$bad" = 1 ]; then
        echo "LH_WEB_URL deve essere l'origine https del reverse proxy davanti al web, senza percorso né barra finale, es. https://loyalty.example.org (attuale: $${web:-assente}; deploy/README.md, Q-420)" >&2
        ko=1
      fi
      [ "$$ko" = 0 ] || exit 1
    fi
    exec "$$@"

# Sicurezza dei container (docs/18 §3.10 punto 10): non root, capability rimosse, niente nuovi privilegi.
x-lh-hardening: &lh-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Forma dei 5 topic e concorrenza (F2-EVT-04, ADR-028): un broker, quindi una replica; nomi dei topic invariati.
# SPEC-GAP: Q-373 — facts e audit a 7 giorni finché M8.4 non toglie le PII dal bus (poi 365 giorni).
x-lh-kafka-env: &lh-kafka-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  # SPEC-GAP: Q-375 — rete compose interna, Kafka senza TLS fino a M8.5.
  KAFKA_SECURITY: "PLAINTEXT"
  LH_KAFKA_TOPICS_CREATE: "true"
  # Retention cambiata: applicata anche ai topic esistenti. Più partizioni: solo con i consumer svuotati.
  LH_KAFKA_TOPICS_MODIFY_CONFIGS: "true"
  LH_KAFKA_TOPICS_ALLOW_PARTITION_INCREASE: "${LH_KAFKA_TOPICS_ALLOW_PARTITION_INCREASE:-false}"
  LH_KAFKA_TOPIC_PARTITIONS: "${LH_KAFKA_TOPIC_PARTITIONS:-12}"
  LH_KAFKA_TOPIC_REPLICAS: "1"
  LH_KAFKA_TOPIC_RETENTION_MS: "${LH_KAFKA_TOPIC_RETENTION_MS:-604800000}"
  LH_KAFKA_FACTS_RETENTION_MS: "${LH_KAFKA_FACTS_RETENTION_MS:-604800000}"
  LH_KAFKA_AUDIT_RETENTION_MS: "${LH_KAFKA_AUDIT_RETENTION_MS:-604800000}"
  LH_KAFKA_CONSUMER_CONCURRENCY: "${LH_KAFKA_CONSUMER_CONCURRENCY:-2}"

x-lh-db-env: &lh-db-env
  DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub"
  DB_USERNAME: "loyaltyhub"
  DB_PASSWORD: "${LH_DB_PASSWORD:-}"

services:
  # ---------- Infrastruttura open source ----------
  # Tag leggibile e digest, gli stessi di deploy/docker-compose.yml: Dependabot non legge questo file per nome, quindi
  # si allineano a mano e scripts/check-helm.mjs segnala le divergenze (Q-483). Kafka 4.2 (Q-481).
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    # Controllo prima di initdb: se lo facesse solo lo script d'inizializzazione, il riavvio automatico troverebbe il
    # volume già inizializzato e partirebbe senza il ruolo idp.
    entrypoint: *lh-require-env
    command: ["lh-require-env", "docker-entrypoint.sh", "postgres"]
    environment:
      POSTGRES_DB: "loyaltyhub"
      POSTGRES_USER: "loyaltyhub"
      POSTGRES_PASSWORD: "${LH_DB_PASSWORD:-}"
      # Ruolo e database propri di Keycloak (come CloudNativePG nel chart): letta solo dallo script d'inizializzazione.
      LH_IDP_DB_PASSWORD: "${LH_IDP_DB_PASSWORD:-}"
      LH_REQUIRED_ENV: "POSTGRES_PASSWORD LH_IDP_DB_PASSWORD"
    volumes:
      - lh-ref-postgres:/var/lib/postgresql/data
      - ./postgres-init/10-idp.sh:/docker-entrypoint-initdb.d/10-idp.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyaltyhub -d loyaltyhub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    cpus: 1

  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      # I topic li crea l'hub con la forma di x-lh-kafka-env: mai per errore di battitura.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Stato dei share group (Kafka 4.x): un solo broker, come per gli altri topic interni.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    volumes:
      - lh-ref-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    mem_limit: 1g
    cpus: 1

  # ---------- Ruoli dell'immagine unica ----------
  # Migrazioni Flyway una volta sola, prima dell'hub (come il Job del chart; ADR-038). Stessa immagine, solo il jar:
  # non passa dall'entrypoint, quindi niente *_FILE.
  migrate:
    <<: *lh-hardening
    image: "${LH_IMAGE:?LH_IMAGE obbligatoria, es. ghcr.io/<owner>/loyaltyhub:v0.7.0}"
    read_only: true
    tmpfs: ["/tmp"]
    entrypoint: *lh-require-env
    command:
      - lh-require-env
      - /usr/lib/jvm/default-jvm/bin/java
      - -Dloader.main=io.loyaltyhub.hub.HubMigrate
      - -cp
      - /opt/lh/hub/hub.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      <<: *lh-db-env
      LH_REQUIRED_ENV: "DB_PASSWORD"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 1g
    cpus: 1

  hub:
    <<: *lh-hardening
    image: "${LH_IMAGE:?LH_IMAGE obbligatoria, es. ghcr.io/<owner>/loyaltyhub:v0.7.0}"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    entrypoint: *lh-require-env-or-file
    command: ["lh-require-env", "/opt/lh/entrypoint.sh"]
    environment:
      <<: [*lh-db-env, *lh-kafka-env]
      LH_ROLE: "hub"
      LH_MODE: "external"
      # enterprise: OIDC obbligatorio (ADR-027). `demo` solo per valutare con i dati fittizi (seed, X-LH-Actor).
      LH_PROFILE: "${LH_PROFILE:-enterprise}"
      LH_IDENTITY_MODE: "${LH_IDENTITY_MODE:-oidc}"
      # Emittente visto dal browser; JWKS letto dentro la rete compose.
      LH_OIDC_ISSUER: "${LH_IDP_PUBLIC_URL:-http://localhost:8180}/realms/loyaltyhub"
      LH_OIDC_JWKS_URI: "http://idp:8080/realms/loyaltyhub/protocol/openid-connect/certs"
      LH_OIDC_AUDIENCE: "hub"
      # Osservabilità (F2-OBS-01, M8.6a): con il profilo observability e LH_OTEL_METRICS_ENABLED=true l'hub invia le metriche in OTLP al collector (servizio otelcol). Spento di default.
      LH_OTEL_METRICS_ENABLED: "${LH_OTEL_METRICS_ENABLED:-false}"
      LH_OTEL_METRICS_URL: "http://otelcol:4318/v1/metrics"
      LH_OTEL_SERVICE_NAMESPACE: "${LH_OTEL_SERVICE_NAMESPACE:-loyaltyhub}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      LH_REQUIRED_ENV: "DB_PASSWORD"
    # Stesso controllo dell'HEALTHCHECK dell'immagine (per ruolo), reso esplicito per i depends_on.
    healthcheck:
      test: ["CMD", "/opt/lh/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Non esposto sull'host: lo raggiunge il web; le API per fonti e widget passeranno dal gateway (M8.5).
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2

  web:
    <<: *lh-hardening
    image: "${LH_IMAGE:?LH_IMAGE obbligatoria, es. ghcr.io/<owner>/loyaltyhub:v0.7.0}"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/opt/lh/web/.next/cache:uid=1000,gid=1000"]
    ports:
      - "${LH_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    entrypoint: *lh-web-oidc-guard
    command: ["lh-web-oidc-guard", "/opt/lh/entrypoint.sh"]
    environment:
      LH_ROLE: "web"
      LH_MODE: "external"
      LH_PROFILE: "${LH_PROFILE:-enterprise}"
      LH_SVC_INGESTION_URL: "http://hub:8080"
      LH_SVC_MEMBER_URL: "http://hub:8080"
      LH_SVC_CAMPAIGN_URL: "http://hub:8080"
      LH_SVC_WALLET_URL: "http://hub:8080"
      LH_SVC_REWARD_URL: "http://hub:8080"
      LH_SVC_GAMIFICATION_URL: "http://hub:8080"
      LH_SVC_ENGAGEMENT_URL: "http://hub:8080"
      LH_SVC_INSIGHT_URL: "http://hub:8080"
      # BFF OIDC (F2-SEC-06, ADR-027), letto solo nel profilo enterprise: stesso emittente dell'hub, stessa origine e
      # stesso segreto del client `web` dati a Keycloak (servizio idp). Nel profilo demo il web li ignora.
      LH_OIDC_ISSUER: "${LH_IDP_PUBLIC_URL:-http://localhost:8180}/realms/loyaltyhub"
      LH_WEB_CLIENT_ID: "web"
      LH_WEB_CLIENT_SECRET: "${LH_WEB_CLIENT_SECRET:-}"
      LH_WEB_URL: "${LH_WEB_URL:-http://localhost:3000}"
      # 32 byte casuali in base64 (openssl rand -base64 32): cifra sessioni e stato del login; cambiarla le chiude.
      LH_WEB_SESSION_KEY: "${LH_WEB_SESSION_KEY:-}"
      # Vuote = default del web (inattività 30 min, massimo 10 h, 10 000 sessioni in memoria; Q-354, Q-409).
      LH_WEB_SESSION_IDLE_SECONDS: "${LH_WEB_SESSION_IDLE_SECONDS:-}"
      LH_WEB_SESSION_MAX_SECONDS: "${LH_WEB_SESSION_MAX_SECONDS:-}"
      LH_WEB_SESSION_MAX_COUNT: "${LH_WEB_SESSION_MAX_COUNT:-}"
    healthcheck:
      test: ["CMD", "/opt/lh/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      hub:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1

  # Keycloak con il realm as code di deploy/idp/realm.json (ADR-027). SPEC-GAP: Q-374. Vulnerabilità note nelle
  # librerie incluse, senza una versione di Keycloak che le corregga: rischio residuo accettato (Q-482, TOBE-007).
  # Solo su 127.0.0.1 dell'host: anche la console /admin è su questa porta, in HTTP (Q-392).
  idp:
    <<: *lh-hardening
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    entrypoint: *lh-require-env
    command: ["lh-require-env", "/opt/keycloak/bin/kc.sh", "start", "--import-realm"]
    ports:
      - "${LH_BIND_ADDRESS:-127.0.0.1}:8180:8080"
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/idp"
      # Ruolo proprio, senza privilegi sul database dell'hub (postgres-init/10-idp.sh).
      KC_DB_USERNAME: "idp"
      KC_DB_PASSWORD: "${LH_IDP_DB_PASSWORD:-}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${LH_IDP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${LH_IDP_ADMIN_PASSWORD:-}"
      KC_HOSTNAME: "${LH_IDP_PUBLIC_URL:-http://localhost:8180}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      LH_REQUIRED_ENV: "KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD LH_WEB_CLIENT_SECRET LH_WIDGETS_CLIENT_SECRET LH_CMS_CLIENT_SECRET"
      # Segnaposto di realm.json (deploy/idp/README.md)
      LH_WEB_URL: "${LH_WEB_URL:-http://localhost:3000}"
      LH_CMS_URL: "${LH_CMS_URL:-http://localhost:8055}"
      LH_WEB_CLIENT_SECRET: "${LH_WEB_CLIENT_SECRET:-}"
      LH_WIDGETS_CLIENT_SECRET: "${LH_WIDGETS_CLIENT_SECRET:-}"
      LH_CMS_CLIENT_SECRET: "${LH_CMS_CLIENT_SECRET:-}"
      LH_JOBS_JWKS_URL: "${LH_JOBS_JWKS_URL:-http://localhost/jwks/lh-jobs.json}"
      LH_SOURCE_CRM_JWKS_URL: "${LH_SOURCE_CRM_JWKS_URL:-http://localhost/jwks/crm.json}"
      LH_SOURCE_APP_JWKS_URL: "${LH_SOURCE_APP_JWKS_URL:-http://localhost/jwks/app.json}"
      LH_SOURCE_ECOMMERCE_JWKS_URL: "${LH_SOURCE_ECOMMERCE_JWKS_URL:-http://localhost/jwks/ecommerce.json}"
      LH_SOURCE_BILLING_JWKS_URL: "${LH_SOURCE_BILLING_JWKS_URL:-http://localhost/jwks/billing.json}"
      LH_SOURCE_PARTNER_JWKS_URL: "${LH_SOURCE_PARTNER_JWKS_URL:-http://localhost/jwks/partner.json}"
    volumes:
      - ../idp/realm.json:/opt/keycloak/data/import/realm.json:ro
    # L'immagine di Keycloak non ha curl: richiesta HTTP con /dev/tcp di bash alla porta di gestione (9000).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2

  # ---------- Osservabilità (profilo observability, F2-OBS-01, M8.6a; ADR-012, ADR-036) ----------
  # Solo metriche: l'hub le invia in OTLP al collector, che le inoltra al ricevitore OTLP di Prometheus; Grafana legge da
  # Prometheus. Nessuna porta di collector e Prometheus sull'host; nessuna telemetria esce dalla rete compose (ADR-044).
  # Immagini con tag leggibile e digest, gli stessi del chart (values.yaml: observability.collector.image, verificato da
  # scripts/check-helm.mjs). Nomi dei servizi senza trattino: scripts/check-helm.mjs li legge per nome.
  otelcol:
    <<: *lh-hardening
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    profiles: ["observability"]
    restart: unless-stopped
    read_only: true
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      GOMEMLIMIT: "200MiB"
    # Nessun healthcheck: l'immagine non ha una shell. Lo stato si vede da `docker compose ps` e da Prometheus.
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    <<: *lh-hardening
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    profiles: ["observability"]
    restart: unless-stopped
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - "--storage.tsdb.retention.time=${LH_PROMETHEUS_RETENTION:-15d}"
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../helm/loyaltyhub/files/observability/slo-rules.json:/etc/prometheus/rules/slo-rules.json:ro
      - lh-ref-prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 1

  # SPEC-GAP: Q-528 — Grafana con l'utente amministratore locale (password obbligatoria, niente accesso anonimo né
  # registrazione, niente comunicazioni verso Grafana Labs); il login con OIDC arriva con M8.5. Solo su LH_BIND_ADDRESS.
  grafana:
    <<: *lh-hardening
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: *lh-require-env
    command: ["lh-require-env", "/run.sh"]
    ports:
      - "${LH_BIND_ADDRESS:-127.0.0.1}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${LH_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${LH_GRAFANA_ADMIN_PASSWORD:-}"
      LH_REQUIRED_ENV: "GF_SECURITY_ADMIN_PASSWORD"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../helm/loyaltyhub/files/observability/dashboards:/etc/lh/dashboards:ro
      - lh-ref-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1

volumes:
  lh-ref-postgres:
  lh-ref-kafka:
  lh-ref-prometheus:
  lh-ref-grafana:
