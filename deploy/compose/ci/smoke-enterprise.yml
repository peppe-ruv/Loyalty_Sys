# SOLO CI. Overlay del compose di riferimento per lo smoke enterprise con login OIDC reale (F2-QA-04, M8.2, ADR-049,
# M8.14 V6). Non è un'installazione e non va usato fuori dal job `smoke enterprise (compose, OIDC)` di ci.yml: lo
# avvia scripts/smoke-enterprise.sh, che genera nel job (cartella temporanea del runner, permessi 0600) segreti, CA di
# prova e certificato del proxy e li passa con --env-file; nessun valore è nel repository, nei log o negli argomenti.
#
#   docker compose --env-file <ci.env> -f deploy/compose/reference.yml -f deploy/compose/ci/smoke-enterprise.yml up -d
#
# Cosa aggiunge al compose di riferimento (profilo enterprise invariato, stesse guardie):
# - `proxy`: reverse proxy TLS di prova, come quello della vetrina (deploy/vetrina/caddy/Caddyfile) ma con un
#   certificato firmato da una CA generata nel job al posto di ACME, su 127.0.0.1:8443. Il web e Keycloak lo
#   raggiungono con gli stessi URL https del runner (alias di rete web.lh.test e idp.lh.test), come chiede Q-420.
#   Strumento di verifica in CI, non componente del prodotto (regola 8-bis non applicabile, come ZAP e Schemathesis).
# - `ldap`: l'LDAP di prova di deploy/docker-compose.yml (profilo idp-test), perché l'overlay di test del realm
#   (deploy/idp/test-idp/realm-test-overlay.json) vi federa gli utenti e Keycloak lo interroga nelle ricerche.
# - web: la CA di prova come CA aggiuntiva di Node (NODE_EXTRA_CA_CERTS), per discovery, scambio del codice e rinnovo.
# - hub: porta su 127.0.0.1:8080, solo per le prove senza token (401) dello smoke.
# - idp: console di amministrazione su http://127.0.0.1:8180, come nella vetrina (overlay del realm e bootstrap.sh).
# I percorsi relativi valgono dalla cartella del primo file (deploy/compose).

services:
  proxy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # Utente del runner: legge la chiave del certificato (0600) senza capability; porta alta, nessun NET_BIND_SERVICE.
    user: "${LH_CI_UID:?LH_CI_UID obbligatoria}:${LH_CI_GID:?LH_CI_GID obbligatoria}"
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./ci/Caddyfile:/etc/caddy/Caddyfile:ro
      - "${LH_CI_TLS_DIR:?LH_CI_TLS_DIR obbligatoria}/server.crt:/etc/lh/tls/server.crt:ro"
      - "${LH_CI_TLS_DIR:?LH_CI_TLS_DIR obbligatoria}/server.key:/etc/lh/tls/server.key:ro"
    networks:
      default:
        aliases:
          - web.lh.test
          - idp.lh.test
    mem_limit: 128m
    cpus: 0.5

  # Stessa immagine e stesso seed del profilo idp-test del compose locale (Q-480: solo prova, mai in produzione).
  ldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Example Org"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "${LH_LDAP_BIND_CREDENTIAL:-}"
    volumes:
      - ../idp/test-idp/ldap-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/10-seed.ldif:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/389"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  web:
    environment:
      NODE_EXTRA_CA_CERTS: /etc/lh/ci/ca.crt
    volumes:
      - "${LH_CI_TLS_DIR:?LH_CI_TLS_DIR obbligatoria}/ca.crt:/etc/lh/ci/ca.crt:ro"

  hub:
    ports:
      - "127.0.0.1:8080:8080"

  idp:
    environment:
      KC_HOSTNAME_ADMIN: "http://127.0.0.1:8180"
    depends_on:
      ldap:
        condition: service_healthy
