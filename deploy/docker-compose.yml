# Ambiente locale con la stessa topologia della demo (docs/11 §9).
#
#   docker compose -f deploy/docker-compose.yml up -d kafka postgres kafka-ui   # solo infrastruttura
#   docker compose -f deploy/docker-compose.yml --profile all up --build        # stack completo
#
# I 5 topic NON sono creati qui (auto.create.topics.enable=false): li crea il profilo Spring `local`
# tramite i bean NewTopic di lh-common (2 partizioni), quando un servizio si avvia (docs/05 §1, docs/11 §9).
name: loyalty-hub

# Default comuni ai servizi backend (profilo `all`): limiti di memoria/CPU per scoprire presto
# i problemi del piano gratuito, connessione a Kafka e Postgres interni alla rete compose.
x-lh-service: &lh-service
  build:
    context: ..
  profiles: ["all"]
  restart: unless-stopped
  mem_limit: 512m
  cpus: 0.5
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
  environment: &lh-service-env
    SPRING_PROFILES_ACTIVE: "demo,local"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    LOYALTYHUB_KAFKA_SECURITY: "PLAINTEXT"
    DB_USERNAME: "loyaltyhub"
    DB_PASSWORD: "loyaltyhub"
    DB_URL_DIRECT: "jdbc:postgresql://postgres:5432/loyaltyhub"

# Guardia per i segreti obbligatori dei profili idp e idp-test. Compose interpola le variabili di TUTTI i
# servizi, anche di profili non attivi: un `${VAR:?}` qui renderebbe obbligatori i segreti dell'IdP anche per
# `up -d kafka postgres kafka-ui`. I segreti hanno quindi default vuoto e il container rifiuta di partire
# (fail-closed) se una variabile elencata in LH_REQUIRED_ENV è vuota. Il valore non viene mai stampato.
x-lh-require-env: &lh-require-env
  - /bin/bash
  - -c
  - |
    for v in $$LH_REQUIRED_ENV; do
      if [ -z "$${!v:-}" ]; then echo "Variabile obbligatoria mancante: $$v" >&2; exit 1; fi
    done
    exec "$$@"

services:
  # ---------- Infrastruttura (sempre disponibile) ----------
  # Immagini con tag leggibile e digest: riproducibili, aggiornate da Dependabot (ecosistema docker-compose, ADR-047).
  # Kafka, Postgres e Keycloak hanno la stessa versione in compose/reference.yml e nei values del chart: lo verifica
  # scripts/check-helm.mjs (Q-483). Kafka segue la linea 4.2 di kafka-clients e del broker dei test (Q-481).
  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    container_name: lh-kafka
    ports:
      - "9092:9092"   # accesso dall'host (es. servizi avviati con ./mvnw)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      # Due listener: PLAINTEXT interno (kafka:29092) per i container, EXTERNAL (localhost:9092) per l'host.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Stato dei share group (Kafka 4.x): con le variabili KAFKA_* il file di default dell'immagine non si usa,
      # quindi un solo broker va dichiarato anche qui.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: lh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "loyaltyhub"
      POSTGRES_USER: "loyaltyhub"
      POSTGRES_PASSWORD: "loyaltyhub"
    volumes:
      - lh-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-idp-db.sql:/docker-entrypoint-initdb.d/init-idp-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyaltyhub -d loyaltyhub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Solo sviluppo, senza autenticazione. kafbat/kafka-ui è il fork mantenuto di provectuslabs/kafka-ui, con le stesse
  # variabili; da Docker Hub, stesso digest di ghcr.io/kafbat/kafka-ui (Q-479).
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: lh-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"   # ispezione dei topic su http://localhost:8090, solo dall'host (Q-479)
    environment:
      KAFKA_CLUSTERS_0_NAME: "loyalty-hub-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Identità (solo con --profile idp; IdP e LDAP di prova con --profile idp-test) ----------
  # Le variabili sono documentate in deploy/idp/README.md. Keycloak sostituisce i segnaposto ${LH_*}
  # di realm.json e realm-members.json (due realm, ADR-051) con queste variabili all'import. I segreti non hanno valore di default: se mancano il
  # container non parte (x-lh-require-env).
  # Gli URL JWKS hanno un default locale segnaposto: finché non puntano al JWKS reale della fonte,
  # l'autenticazione private_key_jwt di quel client fallisce (fail-closed).
  idp:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: lh-idp
    profiles: ["idp"]
    entrypoint: *lh-require-env
    command: ["lh-require-env", "/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/idp"
      KC_DB_USERNAME: "loyaltyhub"
      KC_DB_PASSWORD: "loyaltyhub"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${LH_IDP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${LH_IDP_ADMIN_PASSWORD:-}"
      LH_REQUIRED_ENV: "KC_BOOTSTRAP_ADMIN_PASSWORD LH_WEB_CLIENT_SECRET LH_PORTAL_CLIENT_SECRET LH_WIDGETS_CLIENT_SECRET LH_CMS_CLIENT_SECRET"
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Segnaposto di realm.json e realm-members.json
      LH_WEB_URL: "${LH_WEB_URL:-http://localhost:3000}"
      LH_CMS_URL: "${LH_CMS_URL:-http://localhost:8055}"
      LH_WEB_CLIENT_SECRET: "${LH_WEB_CLIENT_SECRET:-}"
      LH_PORTAL_CLIENT_SECRET: "${LH_PORTAL_CLIENT_SECRET:-}"
      LH_WIDGETS_CLIENT_SECRET: "${LH_WIDGETS_CLIENT_SECRET:-}"
      LH_CMS_CLIENT_SECRET: "${LH_CMS_CLIENT_SECRET:-}"
      LH_JOBS_JWKS_URL: "${LH_JOBS_JWKS_URL:-http://localhost/jwks/lh-jobs.json}"
      LH_SOURCE_CRM_JWKS_URL: "${LH_SOURCE_CRM_JWKS_URL:-http://localhost/jwks/crm.json}"
      LH_SOURCE_APP_JWKS_URL: "${LH_SOURCE_APP_JWKS_URL:-http://localhost/jwks/app.json}"
      LH_SOURCE_ECOMMERCE_JWKS_URL: "${LH_SOURCE_ECOMMERCE_JWKS_URL:-http://localhost/jwks/ecommerce.json}"
      LH_SOURCE_BILLING_JWKS_URL: "${LH_SOURCE_BILLING_JWKS_URL:-http://localhost/jwks/billing.json}"
      LH_SOURCE_PARTNER_JWKS_URL: "${LH_SOURCE_PARTNER_JWKS_URL:-http://localhost/jwks/partner.json}"
    volumes:
      # I due realm (ADR-051); l'overlay di prova si applica con deploy/idp/test-idp/apply-overlay.sh. Keycloak rifiuta
      # un file <nome>-realm.json che contiene un realm diverso: il realm dei membri va montato con il suo nome.
      - ./idp/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./idp/realm-members.json:/opt/keycloak/data/import/loyaltyhub-members-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Solo prova (F2-IAM-04): IdP OIDC secondario per il broker. Mai in produzione.
  idp-test:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: lh-idp-test
    profiles: ["idp-test"]
    entrypoint: *lh-require-env
    command: ["lh-require-env", "/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    ports:
      - "8089:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${LH_TEST_IDP_ADMIN_PASSWORD:-}"
      LH_REQUIRED_ENV: "KC_BOOTSTRAP_ADMIN_PASSWORD LH_TEST_IDP_SECRET"
      KC_HEALTH_ENABLED: "true"
      LH_TEST_IDP_SECRET: "${LH_TEST_IDP_SECRET:-}"
    volumes:
      # Keycloak rifiuta un file <nome>-realm.json che contiene un realm diverso: va montato come idp-test-realm.json.
      - ./idp/test-idp/test-realm.json:/opt/keycloak/data/import/idp-test-realm.json:ro

  # Solo prova (F2-IAM-04): LDAP per la federazione. La password admin è la stessa che Keycloak
  # usa come bindCredential (LH_LDAP_BIND_CREDENTIAL). Mai in produzione. Immagine non più mantenuta, con
  # vulnerabilità note senza correzione: rischio accettato solo per questo profilo, da sostituire con M8.2 (Q-480).
  ldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    container_name: lh-ldap
    profiles: ["idp-test"]
    entrypoint: *lh-require-env
    command: ["lh-require-env", "/container/tool/run", "--copy-service"]
    ports:
      - "127.0.0.1:389:389"   # solo dall'host (Q-480)
    environment:
      LDAP_ORGANISATION: "Example Org"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "${LH_LDAP_BIND_CREDENTIAL:-}"
      LH_REQUIRED_ENV: "LDAP_ADMIN_PASSWORD"
    volumes:
      - ./idp/test-idp/ldap-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/10-seed.ldif:ro

  # ---------- Servizi backend (solo con --profile all; Dockerfile da M0.5) ----------
  ingestion-service:
    <<: *lh-service
    container_name: lh-ingestion
    build:
      context: ..
      dockerfile: services/ingestion-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      <<: *lh-service-env
      PORT: "8081"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=ingestion"

  member-service:
    <<: *lh-service
    container_name: lh-member
    build:
      context: ..
      dockerfile: services/member-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      <<: *lh-service-env
      PORT: "8082"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=member"

  campaign-service:
    <<: *lh-service
    container_name: lh-campaign
    build:
      context: ..
      dockerfile: services/campaign-service/Dockerfile
    ports: ["8083:8083"]
    environment:
      <<: *lh-service-env
      PORT: "8083"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=campaign"

  wallet-service:
    <<: *lh-service
    container_name: lh-wallet
    build:
      context: ..
      dockerfile: services/wallet-service/Dockerfile
    ports: ["8084:8084"]
    environment:
      <<: *lh-service-env
      PORT: "8084"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=wallet"

  reward-service:
    <<: *lh-service
    container_name: lh-reward
    build:
      context: ..
      dockerfile: services/reward-service/Dockerfile
    ports: ["8085:8085"]
    environment:
      <<: *lh-service-env
      PORT: "8085"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=reward"

  gamification-service:
    <<: *lh-service
    container_name: lh-gamification
    build:
      context: ..
      dockerfile: services/gamification-service/Dockerfile
    ports: ["8086:8086"]
    environment:
      <<: *lh-service-env
      PORT: "8086"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=gamification"

  engagement-service:
    <<: *lh-service
    container_name: lh-engagement
    build:
      context: ..
      dockerfile: services/engagement-service/Dockerfile
    ports: ["8087:8087"]
    environment:
      <<: *lh-service-env
      PORT: "8087"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=engagement"

  insight-service:
    <<: *lh-service
    container_name: lh-insight
    build:
      context: ..
      dockerfile: services/insight-service/Dockerfile
    ports: ["8088:8088"]
    environment:
      <<: *lh-service-env
      PORT: "8088"
      DB_URL: "jdbc:postgresql://postgres:5432/loyaltyhub?currentSchema=insight"
      # Riprocessa DLQ di un'azione (M7.3, ADR-002 eccezione 1).
      LH_INGESTION_URL: "http://ingestion-service:8081"

  # Web dall'immagine unica (deploy/image, ADR-037) con il solo ruolo web, come nel compose di riferimento e nel chart
  # (Q-484). La build compila anche l'hub (stesso Dockerfile): il primo `up --build` è più lungo.
  web:
    build:
      context: ..
      dockerfile: deploy/image/Dockerfile
    image: loyaltyhub:local
    container_name: lh-web
    profiles: ["all"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp", "/opt/lh/web/.next/cache:uid=1000,gid=1000"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports: ["3000:3000"]
    environment:
      LH_ROLE: "web"
      LH_MODE: "external"
      LH_PROFILE: "demo"
      # Il proxy /api/lh del web raggiunge i servizi sulla rete compose (docs/07, web/lib/api/services.ts).
      LH_SVC_INGESTION_URL: "http://ingestion-service:8081"
      LH_SVC_MEMBER_URL: "http://member-service:8082"
      LH_SVC_CAMPAIGN_URL: "http://campaign-service:8083"
      LH_SVC_WALLET_URL: "http://wallet-service:8084"
      LH_SVC_REWARD_URL: "http://reward-service:8085"
      LH_SVC_GAMIFICATION_URL: "http://gamification-service:8086"
      LH_SVC_ENGAGEMENT_URL: "http://engagement-service:8087"
      LH_SVC_INSIGHT_URL: "http://insight-service:8088"
    depends_on:
      - ingestion-service
      - member-service
      - campaign-service
      - wallet-service

volumes:
  lh-postgres-data:
