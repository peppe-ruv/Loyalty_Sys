{{- /*
Segnaposto del gateway (docs/18 §3.10, M8.5): JWT, rate limit, CORS e header arriveranno con M8.5. Qui solo un
HTTPRoute (Gateway API) verso l'hub per le API /v1 di fonti e widget, agganciato a un Gateway già presente nel
cluster. Spento di default.
*/ -}}
{{- if and .Values.gateway.enabled .Values.roles.hub.enabled }}
{{- if not .Values.gateway.parentRefs }}
{{- fail "gateway.parentRefs: indicare il Gateway esistente a cui agganciare la route" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "loyaltyhub.fullname" . }}-api
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "gateway") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - name: {{ include "loyaltyhub.fullname" . }}-hub
          port: {{ .Values.roles.hub.port }}
{{- end }}
