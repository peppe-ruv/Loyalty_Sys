{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loyaltyhub.serviceAccountName" . }}
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nessun Pod del chart parla con l'API di Kubernetes: niente token montato (docs/18 §3.10 punto 10).
automountServiceAccountToken: false
{{- end }}
