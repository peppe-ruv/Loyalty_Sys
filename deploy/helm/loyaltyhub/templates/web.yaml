{{- /* Ruolo web dell'immagine unica: portale, backoffice e BFF (ADR-027, ADR-037, F2-DIST-02). */ -}}
{{- if .Values.roles.web.enabled }}
{{- $r := .Values.roles.web }}
{{- $hub := printf "http://%s-hub:%d" (include "loyaltyhub.fullname" .) (int (include "loyaltyhub.port.hub" .)) }}
{{- $enterprise := eq .Values.global.profile "enterprise" }}
{{- $issuerCa := and $enterprise $r.bff.issuerCaBundle.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loyaltyhub.fullname" . }}-web
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "web") | nindent 4 }}
spec:
  {{- if not $r.autoscaling.enabled }}
  replicas: {{ $r.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "loyaltyhub.selectorLabels" (dict "ctx" $ "role" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "web") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "loyaltyhub.podCommon" (dict "ctx" $ "role" "web" "serviceAccount" true) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "loyaltyhub.image" . }}
          imagePullPolicy: {{ include "loyaltyhub.imagePullPolicy" . }}
          securityContext:
            {{- include "loyaltyhub.containerSecurityContext" (dict "ctx" $) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "loyaltyhub.port.web" . }}
          env:
            - name: LH_ROLE
              value: web
            - name: LH_MODE
              value: {{ .Values.global.mode | quote }}
            - name: LH_PROFILE
              value: {{ .Values.global.profile | quote }}
            # Il proxy /api/lh del BFF raggiunge i moduli dentro il cluster: tutti stanno nel ruolo hub.
            {{- range $svc := list "INGESTION" "MEMBER" "CAMPAIGN" "WALLET" "REWARD" "GAMIFICATION" "ENGAGEMENT" "INSIGHT" }}
            - name: LH_SVC_{{ $svc }}_URL
              value: {{ $hub | quote }}
            {{- end }}
            {{- if $enterprise }}
            {{- $clientSecret := include "loyaltyhub.web.clientSecretRef" . | fromJson }}
            # BFF OIDC (F2-SEC-06, ADR-027): stesso emittente dell'hub, raggiunto con l'URL pubblico (lo stesso del
            # browser, come vuole la discovery); segreti solo da Secret. Valori verificati dal web all'avvio
            # (INSECURE_CONFIG) e dal chart (loyaltyhub.validate.identity).
            - name: LH_OIDC_ISSUER
              value: {{ include "loyaltyhub.oidc.issuer" . | quote }}
            - name: LH_WEB_CLIENT_ID
              value: {{ $r.bff.clientId | quote }}
            - name: LH_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $clientSecret.name }}, key: {{ $clientSecret.key }} }
            - name: LH_WEB_URL
              value: {{ include "loyaltyhub.web.publicUrl" . | quote }}
            - name: LH_WEB_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: {{ $r.bff.sessionKey.name }}, key: {{ $r.bff.sessionKey.key }} }
            - name: LH_WEB_SESSION_IDLE_SECONDS
              value: {{ $r.bff.sessionIdleSeconds | int64 | quote }}
            - name: LH_WEB_SESSION_MAX_SECONDS
              value: {{ $r.bff.sessionMaxSeconds | int64 | quote }}
            - name: LH_WEB_SESSION_MAX_COUNT
              value: {{ $r.bff.sessionMaxCount | int64 | quote }}
            {{- if $issuerCa }}
            # CA privata dell'emittente, aggiunta alle CA pubbliche di Node: il certificato dell'IdP resta verificato.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/lh/issuer-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness solo sul processo (porta aperta): /api/demo/status interroga l'hub per ogni modulo e un hub lento
          # farebbe riavviare il web. La readiness invece usa lo stato aggregato.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/demo/status, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Cache di Next.js (immagini, ISR): l'unico percorso scritto dal server, il resto è in sola lettura.
            - name: next-cache
              mountPath: /opt/lh/web/.next/cache
            {{- if $issuerCa }}
            - name: issuer-ca
              mountPath: /etc/lh/issuer-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- if $issuerCa }}
        - name: issuer-ca
          configMap:
            name: {{ $r.bff.issuerCaBundle.name }}
            items:
              - key: {{ $r.bff.issuerCaBundle.key }}
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loyaltyhub.fullname" . }}-web
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "loyaltyhub.selectorLabels" (dict "ctx" $ "role" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "loyaltyhub.port.web" . }}
      targetPort: http
{{- if $r.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "loyaltyhub.fullname" . }}-web
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "web") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "loyaltyhub.fullname" . }}-web
  minReplicas: {{ $r.autoscaling.minReplicas }}
  maxReplicas: {{ $r.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $r.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $r.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "loyaltyhub.fullname" . }}-web
  labels:
    {{- include "loyaltyhub.labels" (dict "ctx" $ "role" "web") | nindent 4 }}
spec:
  minAvailable: {{ $r.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "loyaltyhub.selectorLabels" (dict "ctx" $ "role" "web") | nindent 6 }}
{{- end }}
{{- end }}
