{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- $health := default "/actuator/health" $svc.healthPath }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "lh.labels" $root | nindent 4 }}
spec:
  replicas: {{ default 1 $svc.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "lh.labels" $root | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        {{- if $svc.java }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      containers:
        - name: {{ $name }}
          image: {{ include "lh.image" (list $root $name $svc) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: ENVIRONMENT
              value: {{ $root.Values.global.environment | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $root.Values.global.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            {{- if $svc.kafka }}
            - name: KAFKA_BOOTSTRAP
              value: {{ $root.Values.global.kafka.bootstrap | quote }}
            {{- if $root.Values.global.kafka.saslIam }}
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: AWS_MSK_IAM
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              value: software.amazon.msk.auth.iam.IAMLoginModule required;
            - name: SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS
              value: software.amazon.msk.auth.iam.IAMClientCallbackHandler
            {{- end }}
            {{- end }}
            {{- if $svc.redis }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ $root.Values.global.redis.host | quote }}
            {{- end }}
            {{- if $svc.db }}
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: db-credentials, key: url } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: DATABASE_URI
              valueFrom: { secretKeyRef: { name: db-credentials, key: uri } }
            {{- end }}
            {{- if $root.Values.global.internalAuth.enabled }}
            - name: INTERNAL_AUTH_ENABLED
              value: "true"
            - name: INTERNAL_AUTH_SCOPE
              value: {{ $root.Values.global.internalAuth.scope | quote }}
            - name: OIDC_ISSUER_URI
              value: {{ $root.Values.global.internalAuth.issuerUri | quote }}
            - name: OIDC_TOKEN_URI
              value: {{ $root.Values.global.internalAuth.tokenUri | quote }}
            - name: OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.internalAuth.secretName }}, key: client-id } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.internalAuth.secretName }}, key: client-secret } }
            {{- end }}
            {{- range $extra := $svc.secretsExtra }}
            - name: {{ $extra | upper | replace "-" "_" }}_KEY
              valueFrom: { secretKeyRef: { name: {{ $extra }}, key: key } }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if $svc.java }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          {{- else }}
          livenessProbe:
            httpGet: { path: {{ $health }}, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ $health }}, port: http }
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "256Mi")) $svc.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "lh.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- if $svc.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $svc.hpa.min }}
  maxReplicas: {{ $svc.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ default 60 $svc.hpa.cpu }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if gt (int (default 1 $svc.replicas)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- if $root.Values.serviceMonitor.enabled }}
---
# RF-117: raccolta metriche Prometheus (actuator per i servizi Java, /metrics per BFF/CMS quando esposto)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- toYaml (default (dict) $root.Values.serviceMonitor.labels) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: http
      path: {{ if $svc.java }}/actuator/prometheus{{ else }}{{ default "/metrics" $svc.metricsPath }}{{ end }}
      interval: 30s
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod }
{{- end }}
{{- end }}
