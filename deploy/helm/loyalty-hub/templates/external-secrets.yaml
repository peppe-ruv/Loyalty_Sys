{{- if .Values.global.secretsStore.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.secretsStore.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: db-credentials
    template:
      data:
        url: "{{ `{{ .url }}` }}"
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        uri: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:5432/{{ .Values.global.db.name }}"
  dataFrom:
    - extract:
        key: {{ .Values.global.secretsStore.prefix }}/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-credentials
spec:
  refreshInterval: 24h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: cms-credentials
  dataFrom:
    - extract:
        key: {{ .Values.global.secretsStore.prefix }}/cms
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: instant-win
spec:
  refreshInterval: 24h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: instant-win
  dataFrom:
    - extract:
        key: {{ .Values.global.secretsStore.prefix }}/instant-win
{{- else }}
# Ambiente locale: segreti creati da make seed / docker compose
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  url: jdbc:postgresql://postgres:5432/loyalty
  username: loyalty
  password: loyalty
  uri: postgresql://loyalty:loyalty@postgres:5432/loyalty
---
apiVersion: v1
kind: Secret
metadata:
  name: cms-credentials
type: Opaque
stringData:
  payload-secret: local-dev-secret-not-for-production
---
apiVersion: v1
kind: Secret
metadata:
  name: instant-win
type: Opaque
stringData:
  key: local-dev-key-not-for-production
{{- end }}
