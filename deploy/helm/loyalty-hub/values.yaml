global:
  registry: ghcr.io/loyalty-hub
  tag: "0.7.0"
  imagePullPolicy: IfNotPresent
  environment: dev
  # Segreti letti da AWS Secrets Manager tramite External Secrets (RP-04)
  secretsStore:
    enabled: true
    region: eu-south-1
    prefix: loyalty-hub-dev
  kafka:
    bootstrap: "kafka:9092"
    saslIam: true
  redis:
    host: "redis"
  db:
    # host/user/password arrivano dal secret; qui solo lo schema URL
    name: loyalty
  otel:
    endpoint: "http://otel-collector.observability:4318"
  # Autenticazione servizio-a-servizio sulle API interne (RF-43). Spenta per difetto: si accende per ambiente,
  # quando c'è un IAM che rilascia i token. Le credenziali arrivano dal gestore dei segreti, mai da qui.
  internalAuth:
    enabled: false
    issuerUri: ""
    tokenUri: ""
    scope: "loyalty.internal"
    secretName: internal-auth
  ingress:
    className: alb
    host: loyalty.example.it
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

# Ogni voce genera Deployment, Service, HPA, PodDisruptionBudget e (se abilitato) ServiceMonitor.
services:
  ingress-adapters:
    port: 8081
    replicas: 3
    java: true
    db: true
    kafka: true
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 3, max: 20, cpu: 60 }
    expose: { path: /v1/actions }
  rules-engine:
    port: 8082
    replicas: 3
    java: true
    db: true
    kafka: true
    # RF-136: RULES_APPLY_EFFECTS=false → il decision-service applica gli effetti (true = modalità storica senza decision-service)
    env: { LEDGER_URL: http://ledger:8083, TIER_URL: http://tier-service:8084, SEGMENT_URL: http://segment-service:8090, CATALOG_URL: http://catalog-redemption:8085, ENGAGEMENT_URL: http://engagement-service:8092, MEMBER_URL: http://member-service:8091, INGRESS_URL: http://ingress-adapters:8081, READ_MODEL_URL: http://read-model:8088, RULES_APPLY_EFFECTS: "false" }
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    hpa: { min: 3, max: 24, cpu: 65 }
  decision-service:
    port: 8093
    replicas: 3
    java: true
    db: true
    kafka: true
    env: { CMS_URL: http://cms:3000, READ_MODEL_URL: http://read-model:8088, RULES_URL: http://rules-engine:8082, LEDGER_URL: http://ledger:8083, CATALOG_URL: http://catalog-redemption:8085, ENGAGEMENT_URL: http://engagement-service:8092, MEMBER_URL: http://member-service:8091, TIER_URL: http://tier-service:8084 }
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    hpa: { min: 3, max: 24, cpu: 65 }
  fraud-service:
    port: 8094
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { CMS_URL: http://cms:3000, LEDGER_URL: http://ledger:8083, FRAUD_AUTO_BLOCK: "true" }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 8, cpu: 65 }
  ledger:
    port: 8083
    replicas: 3
    java: true
    db: true
    kafka: true
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    hpa: { min: 3, max: 12, cpu: 60 }
  tier-service:
    port: 8084
    replicas: 2
    java: true
    db: true
    kafka: true
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 8, cpu: 60 }
  catalog-redemption:
    port: 8085
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { LEDGER_URL: http://ledger:8083 }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 12, cpu: 60 }
  contest-service:
    port: 8086
    replicas: 3
    java: true
    db: true
    kafka: true
    # Modulo periziato (RC-02): nessun rilascio a concorso avviato; nodi nella sola region italiana (RC-01)
    secretsExtra: [instant-win]
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    hpa: { min: 3, max: 30, cpu: 55 }
  segment-service:
    port: 8090
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { READ_MODEL_URL: http://read-model:8088 }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 6, cpu: 65 }
  member-service:
    port: 8091
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { LEDGER_URL: http://ledger:8083, READ_MODEL_URL: http://read-model:8088 }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 8, cpu: 65 }
  engagement-service:
    port: 8092
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { LEDGER_URL: http://ledger:8083, CATALOG_URL: http://catalog-redemption:8085 }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 2, max: 8, cpu: 65 }
  identity-mapping:
    port: 8087
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { LEDGER_URL: http://ledger:8083, MEMBER_URL: http://member-service:8091, IDENTITY_MERGE_TRANSFER_UNITS: "true" }
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  read-model:
    port: 8088
    replicas: 3
    java: true
    db: true
    kafka: true
    redis: true
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    hpa: { min: 3, max: 16, cpu: 60 }
  notifier:
    port: 8089
    replicas: 2
    java: true
    db: true
    kafka: true
    env: { CMS_URL: http://cms:3000 }
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  bff:
    port: 3001
    replicas: 3
    env: { READ_MODEL_URL: http://read-model:8088, TIER_URL: http://tier-service:8084, CONTEST_URL: http://contest-service:8086, CMS_URL: http://cms:3000, MEMBER_URL: http://member-service:8091, SEGMENT_URL: http://segment-service:8090, CATALOG_URL: http://catalog-redemption:8085, INGRESS_URL: http://ingress-adapters:8081, LEDGER_URL: http://ledger:8083, ENGAGEMENT_URL: http://engagement-service:8092, RULES_URL: http://rules-engine:8082, DECISION_URL: http://decision-service:8093, FRAUD_URL: http://fraud-service:8094, NOTIFIER_URL: http://notifier:8089, IDENTITY_URL: http://identity-mapping:8087 }
    healthPath: /healthz
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
    hpa: { min: 3, max: 20, cpu: 60 }
    expose: { path: /api }
  site:
    port: 3000
    replicas: 3
    env: { BFF_URL: http://bff:3001 }
    healthPath: /
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
    hpa: { min: 3, max: 20, cpu: 60 }
    expose: { path: / }
  cms:
    port: 3000
    replicas: 2
    db: true
    env: { CMS_URL: https://loyalty.example.it/admin, SUPERSET_URL: http://superset.analytics:8088, SUPERSET_PUBLIC_URL: https://bi.loyalty.example.it, NEXT_PUBLIC_GRAFANA_URL: https://monitoring.loyalty.example.it/dashboards, DECISION_URL: http://decision-service:8093, FRAUD_URL: http://fraud-service:8094 }
    payloadSecret: cms-credentials
    metricsPath: /api/metrics
    healthPath: /admin
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    expose: { path: /admin }

kafkaTopics:
  enabled: true
  partitions: 12
  replication: 3
  topics:
    - loyalty.actions.v1
    - loyalty.actions.dlq.v1
    - loyalty.movements.v1
    - loyalty.tiers.v1
    - loyalty.redemptions.v1
    - loyalty.contests.v1
    - loyalty.members.v1
    - loyalty.segments.v1

# RF-117: ServiceMonitor per ogni servizio quando lo stack di monitoraggio (deploy/observability) è installato
serviceMonitor:
  enabled: true
  labels: { release: monitoring }
