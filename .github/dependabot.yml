version: 2
# ADR-047: poche PR di dipendenze. Una sola PR aperta per ecosistema: minor e patch raggruppati in un'unica PR,
# le major arrivano una alla volta (valutate a parte). Le azioni di GitHub si controllano una volta al mese.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      # Spring Boot e i moduli Spring si aggiornano insieme (stessa BOM), anche nelle major.
      spring:
        patterns:
          - "*spring*"
      # surefire e failsafe restano alla stessa versione (rapporti dei testbook).
      maven-test-plugins:
        patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-failsafe-plugin"
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Override di sicurezza del pom padre (#112, ADR-044: proprietà lh.jackson3.version, lh.jackson2.version,
      # lh.lz4-java.version): solo patch nella stessa linea, per non staccarsi da quella del BOM di Spring Boot 4.1.x.
      # Si tolgono insieme agli override quando una 4.1.x del BOM porta versioni uguali o successive (pom.xml).
      - dependency-name: "tools.jackson:jackson-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tools.jackson.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.fasterxml.jackson.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "at.yawk.lz4:lz4-java"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      # react e react-dom devono avere la stessa versione, altrimenti le suite di componenti falliscono.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # I tipi di Node seguono il runtime usato in CI e nel deploy (Node 22): niente major finché non cambia.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Immagini base dei Dockerfile (tag leggibile + digest): Dependabot aggiorna tag e digest insieme.
  - package-ecosystem: "docker"
    directories:
      - "/deploy/hub"
      - "/deploy/image"
      - "/services/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Java segue la versione del parent POM (25, LTS) e Node il runtime della CI (22): niente major finché non cambiano.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Immagini di deploy/docker-compose.yml (infrastruttura locale, Keycloak, LDAP di prova). deploy/compose/reference.yml
  # e i values del chart non sono letti da Dependabot e si allineano a mano: scripts/check-helm.mjs (job helm) fallisce
  # finché Kafka, Postgres e Keycloak non hanno la stessa versione nei tre file (Q-483).
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Una major di Postgres non legge il volume della precedente (serve pg_upgrade o dump e ripristino).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Kafka segue la major di kafka-clients (4.x, Q-481): una major nuova si valuta con una fetta, niente PR automatica.
      - dependency-name: "apache/kafka"
        update-types: ["version-update:semver-major"]
      # Una major di Keycloak tocca il realm as code (deploy/idp): si aggiorna con una fetta dedicata.
      - dependency-name: "quay.io/keycloak/keycloak"
        update-types: ["version-update:semver-major"]
