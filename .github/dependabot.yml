version: 2
# ADR-047: poche PR di dipendenze. Una sola PR aperta per ecosistema: minor e patch raggruppati in un'unica PR,
# le major arrivano una alla volta (valutate a parte). Le azioni di GitHub si controllano una volta al mese.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      # Spring Boot e i moduli Spring si aggiornano insieme (stessa BOM), anche nelle major.
      spring:
        patterns:
          - "*spring*"
      # surefire e failsafe restano alla stessa versione (rapporti dei testbook).
      maven-test-plugins:
        patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-failsafe-plugin"
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      # react e react-dom devono avere la stessa versione, altrimenti le suite di componenti falliscono.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # I tipi di Node seguono il runtime usato in CI e nel deploy (Node 22): niente major finché non cambia.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Immagini base dei Dockerfile (tag leggibile + digest): Dependabot aggiorna tag e digest insieme.
  - package-ecosystem: "docker"
    directories:
      - "/deploy/hub"
      - "/deploy/image"
      - "/services/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Java segue la versione del parent POM (25, LTS) e Node il runtime della CI (22): niente major finché non cambiano.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Immagini di deploy/docker-compose.yml (infrastruttura locale, Keycloak, LDAP di prova). deploy/compose/reference.yml
  # e i values del chart non sono letti da Dependabot e si allineano a mano (SPEC-GAP: Q-483).
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Una major di Postgres non legge il volume della precedente (serve pg_upgrade o dump e ripristino).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
