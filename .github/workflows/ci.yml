name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  services:
    name: Java services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f services/pom.xml verify
      - uses: actions/upload-artifact@v4
        with: { name: jars, path: services/*/target/*.jar, retention-days: 1 }
  web:
    name: Web and CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check web/bff/src/server.js
      - run: cd web/site && npm install --no-audit --no-fund && npm run build
  deploy:
    name: Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/loyalty-hub -f deploy/helm/loyalty-hub/values-dev.yaml
      - run: helm template lh deploy/helm/loyalty-hub -f deploy/helm/loyalty-hub/values-dev.yaml > /tmp/rendered.yaml && wc -l /tmp/rendered.yaml
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.13.3" }
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false && terraform -chdir=deploy/terraform validate
