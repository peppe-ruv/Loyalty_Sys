name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"
      - run: ./mvnw -q -B clean verify
      - run: bash scripts/check-mermaid.mjs docs

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable pnpm
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm lint
      - run: cd web && pnpm typecheck
      - run: cd web && pnpm test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Gate strutturale veloce; la validazione JSON Schema completa è in ContractsTest (job backend).
      - run: node scripts/check-contracts.mjs
      - run: npm ci --prefix scripts
      - run: node scripts/check-api.mjs

  docker:
    name: docker (solo main)
    if: github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"
      - run: ./mvnw -q -B -pl deploy/hub -am package -DskipTests
      - run: docker build -t peppe-ruv/loyaltyhub-demo -f deploy/hub/Dockerfile deploy/hub/
