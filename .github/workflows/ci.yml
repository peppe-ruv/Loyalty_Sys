name: ci

# Integrazione continua (docs/11 §10): l'arbitro del progetto.
# ADR-047: una sola esecuzione per PR (niente doppio push + pull_request), job per area con filtro sui file
# cambiati, backend diviso in gruppi paralleli. I controlli obbligatori del ruleset `main-protetto` restano
# `backend (Java 25)`, `web (Next.js)`, `seed`, `contracts`, `guard`, `helm (chart e compose)`, `docs` (M8.9): un job saltato perché
# l'area non cambia conta come superato.
# Il job `security` (M8.11b) gira sempre ed è consultivo: non è tra i controlli obbligatori finché non si dimostra stabile.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimo privilegio per il GITHUB_TOKEN: la CI legge soltanto.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Aree toccate dalla modifica. Su main e su esecuzione manuale gira tutto.
  changes:
    name: aree
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      helm: ${{ steps.filter.outputs.helm }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "helm=true" >> "$GITHUB_OUTPUT"; echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$files"
          # Backend: tutto tranne documentazione (docs/, sito Mintlify, .md/.mdx) e il frontend
          # (seed/ e contracts/ li leggono i test Java). Niente `grep -q` in pipeline: con pipefail darebbe falsi negativi.
          doc='^(docs/|site/|api/|concetti/|guide/|operations/|specifiche/|getting-started/|docs\.json$)|\.mdx?$'
          code=$(grep -Ev "$doc" <<< "$files" | grep -Ev '^web/' || true)
          if [ -n "$code" ]; then backend=true; else backend=false; fi
          # Il workflow stesso fa girare tutto.
          if grep -q '^\.github/workflows/' <<< "$files"; then backend=true; fi
          # Web: i test leggono anche i contratti evento (lib/messages/facts.test.ts).
          if grep -Eq '^(web/|contracts/events/|\.github/workflows/)' <<< "$files"; then web=true; else web=false; fi
          # Chart Helm e compose (M8.3): chart, compose di riferimento (con l'overlay di vetrina, M8.14c) e locale (immagini condivise, Q-483), immagine
          # (porte ed entrypoint), realm copiato nel chart, la verifica stessa e il workflow. Anche lo smoke, che il job
          # `helm install (kind)` esegue attraverso il gateway.
          if grep -Eq '^(deploy/helm/|deploy/compose/|deploy/vetrina/|deploy/docker-compose\.yml$|deploy/image/|deploy/idp/realm\.json$|scripts/check-helm\.mjs$|scripts/smoke\.sh$|\.github/workflows/)' <<< "$files"; then helm=true; else helm=false; fi
          # Documentazione (M8.9, ADR-040): pagine Mintlify e loro configurazione, sorgenti delle pagine generate
          # (schemi evento, OpenAPI), generatore e verifiche, .mintignore e il workflow stesso.
          if grep -Eq '^(docs/|site/|api/|concetti/|guide/|operations/|specifiche/|getting-started/|index\.mdx$|docs\.json$|\.mintignore$|contracts/(events|api)/|scripts/(docs-sync|check-mermaid|check-frontmatter)|scripts/package(-lock)?\.json$|\.github/workflows/)' <<< "$files"; then docs=true; else docs=false; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "backend=$backend web=$web helm=$helm docs=$docs"

  # Backend in gruppi paralleli: ognuno installa i moduli a monte senza test e verifica solo i propri.
  # I test usano Kafka in-JVM (EmbeddedKafka) e Postgres in-process (Zonky): niente Docker (Q-40).
  backend-part:
    name: backend ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lh-common
            modules: libs/lh-common
          - group: ingestion-member-campaign
            modules: services/ingestion-service,services/member-service,services/campaign-service
          - group: wallet-reward
            modules: services/wallet-service,services/reward-service
          - group: gamification-engagement-insight
            modules: services/gamification-service,services/engagement-service,services/insight-service
          - group: hub
            modules: deploy/hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Moduli a monte (senza test)
        # -DskipITs serve: failsafe 3.6 non salta gli IT con il solo -DskipTests.
        run: ./mvnw -B -ntp install -DskipTests -DskipITs -pl "${{ matrix.modules }}" -am
      - name: Build e test
        run: ./mvnw -B -ntp verify -pl "${{ matrix.modules }}"

  # Nome invariato: è il controllo obbligatorio del ruleset. Verde se i gruppi sono verdi o se il backend non cambia.
  backend:
    name: backend (Java 25)
    needs: [changes, backend-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGED: ${{ needs.changes.result }}
          PARTS: ${{ needs.backend-part.result }}
        run: |
          echo "aree: $CHANGED, gruppi backend: $PARTS"
          [ "$CHANGED" = "success" ] || exit 1
          [ "$PARTS" = "success" ] || [ "$PARTS" = "skipped" ] || exit 1

  # Governance del repository (docs/18 §3.13, ADR-041): le ADR di docs/13 solo in aggiunta e gli ID di seed/
  # invariati senza la label "decisione". Gira solo sulle pull request; dopo aver aggiunto la label si rilancia il job.
  guard:
    name: guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: ADR solo in aggiunta, ID seed stabili
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-adr-append-only.mjs "origin/$BASE_REF" HEAD "--pr-labels=$PR_LABELS"
      # ID unici in docs/15: due fette parallele non possono registrare lo stesso Q-nnn (ADR-047).
      - name: Domande aperte con ID unici
        run: node --test scripts/check-questions.test.mjs && node scripts/check-questions.mjs
      # Pagine Mintlify del backlog generate da docs/17 e dallo snapshot delle evidenze (M8.9b, ADR-040): --check
      # verifica solo la struttura, quindi non dipende da docs/14, dal testbook, dai test o dai seed.
      - name: Pagine generate allineate (docs-sync)
        run: node --test scripts/docs-sync.test.mjs && node scripts/docs-sync.mjs --check
      # Avviso, mai bloccante: quante storie cambierebbero con --refresh (lo fa la PR di stato cumulativa, ADR-047).
      - name: Evidenze del backlog da aggiornare (avviso)
        continue-on-error: true
        run: node scripts/docs-sync.mjs --check-status

  # Documentazione Mintlify (F2-DOC-01, F2-DOC-02, F2-DOC-03; ADR-040; docs/18 §3.12): pagine generate allineate
  # (docs-sync --check), link interni (mint broken-links, versione fissata), diagrammi Mermaid validi con accTitle e
  # accDescr (check-mermaid) e frontmatter con title e description. Il filtro sui file sta nel job `changes`: se la PR
  # non tocca la documentazione il job è saltato e conta come superato. `.mintignore` tiene fuori dal sito i sorgenti;
  # mint segnala comunque, senza fallire, di aver letto i template Helm quando cerca file OpenAPI.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # mermaid e jsdom sono devDependencies di scripts/ (check-mermaid.mjs).
      - name: Dipendenze degli script
        run: npm --prefix scripts ci
      - name: Pagine generate allineate (docs-sync)
        run: node --test scripts/docs-sync.test.mjs && node scripts/docs-sync.mjs --check
      - name: Broken links
        run: npx -y mint@4.2.952 broken-links
      - name: Validità diagrammi Mermaid
        run: node scripts/check-mermaid.mjs docs api concetti getting-started guide operations specifiche
      - name: Frontmatter valido
        run: node --test scripts/check-frontmatter.test.mjs && node scripts/check-frontmatter.mjs

  # Sicurezza (F2-SEC-10, F2-SEC-12, F2-SEC-03; ADR-042, ADR-044; docs/security/ci-security.md). Gira a ogni PR e su main,
  # senza filtro sui file: la sicurezza è trasversale. Quattro controlli, tutti con versioni fissate e senza servizi
  # esterni (niente token, niente Semgrep Cloud, telemetria spenta):
  #   1. SAST: Semgrep con le regole del progetto in .semgrep/rules (SQL solo parametrico, java.sql.Statement, SpEL,
  #      header, segreti nei log: regole 19 e 20 di CLAUDE.md); le regole hanno test (semgrep --test).
  #   2. Dipendenze: Trivy su Maven (pom.xml), pnpm (web/pnpm-lock.yaml) e npm (scripts/package-lock.json);
  #      blocca HIGH e CRITICAL con correzione disponibile.
  #   3. IaC: Trivy config su chart Helm reso, compose di riferimento e locale, Dockerfile dell'immagine unica
  #      (scripts/security-iac.sh); blocca HIGH e CRITICAL.
  #   4. Segreti: gitleaks sulla storia intera (--redact: il valore non compare mai nei log).
  # Le eccezioni hanno scadenza e riferimento a docs/15 o docs/19 (.trivyignore.yaml, .trivy/ignore-policy.rego,
  # .gitleaks.toml, `nosemgrep` con giustificazione). CONSULTIVO: non è nel ruleset (scripts/setup-branch-protection.sh);
  # il proprietario lo rende obbligatorio quando si dimostra stabile (ADR-047). Restano fuori da questo job: CodeQL,
  # Schemathesis e ZAP (M8.11, job notturno), le immagini e la firma (M8.5a, image.yml).
  # Trivy si installa con l'azione locale .github/actions/setup-trivy (release ufficiale, SHA-256 verificato: versione e
  # somma stanno in un solo posto, come nel job `build` di image.yml, Q-501). gitleaks si scarica dalla release
  # fissata e se ne verifica lo SHA-256 nello stesso modo: niente toolchain Go, niente cache da invalidare.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_VERSION: 1.178.0
      HELM_VERSION: v3.18.4
      SEMGREP_SEND_METRICS: "off"
      TRIVY_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks legge tutta la storia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Regole del progetto (semgrep --test)
        if: ${{ !cancelled() }}
        run: semgrep --test --config .semgrep/rules .semgrep/tests --metrics=off --disable-version-check
      - name: Semgrep sul codice (regole 19 e 20)
        if: ${{ !cancelled() }}
        # --error: qualunque segnalazione fa fallire il job. Solo le regole del repository: nessun registro remoto.
        run: semgrep scan --config .semgrep/rules --metrics=off --disable-version-check --error libs services deploy
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/setup-trivy
      - name: Installa gitleaks
        # Release fissata con SHA-256 verificato (la riga di gitleaks_8.30.1_checksums.txt della release). Per aggiornare:
        # cambia le due variabili. Nessuna azione di terze parti.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "${tmp}" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
          rm -rf "${tmp}"
          gitleaks version
      - uses: actions/setup-java@v6
        id: java
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Repository Maven locale (POM per Trivy)
        # Trivy ricostruisce l'albero delle dipendenze dai POM di ~/.m2. Con la cache del job backend (stessa chiave) è già
        # tutto lì; se manca, lo risolve Maven (con i suoi tentativi), non Trivy: le richieste di Trivy a Maven Central
        # prendono 429 dagli IP condivisi dei runner. test-compile e non dependency:resolve: nel reactor i moduli fratelli
        # (lh-test-support, dipendenza di test di lh-common) non sono installati in ~/.m2 e solo una fase del ciclo li
        # risolve dal reactor; così scarica anche le dipendenze di test e i plugin, senza eseguire test.
        if: ${{ !cancelled() && steps.java.outputs.cache-hit != 'true' }}
        run: ./mvnw -B -q -ntp test-compile
      - name: Dipendenze (Trivy, Maven, pnpm, npm)
        if: ${{ !cancelled() }}
        # --offline-scan: nessuna richiesta a Maven Central durante la scansione, i POM vengono da ~/.m2 (passo sopra).
        # --ignore-unfixed: senza correzione disponibile non si blocca; con correzione disponibile sì (aggiornare in patch,
        # o accettare in .trivyignore.yaml con scadenza).
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --include-dev-deps --offline-scan \
            --ignorefile .trivyignore.yaml --exit-code 1 --no-progress \
            --skip-dirs '**/node_modules' --skip-dirs '**/target' .
      - name: IaC (chart Helm, compose, Dockerfile)
        if: ${{ !cancelled() }}
        run: bash scripts/security-iac.sh
      - name: Segreti (gitleaks, storia intera)
        if: ${{ !cancelled() }}
        # --log-opts: tutta la storia raggiungibile da HEAD (fetch-depth: 0). --redact: il valore del segreto non compare
        # mai nel log. Eccezioni solo in .gitleaks.toml, con giustificazione.
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--full-history HEAD" .

  web:
    name: web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  seed:
    name: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm --prefix scripts ci --omit=dev
      - run: node --test scripts/check-seed.test.mjs
      - run: node scripts/check-seed.mjs
      # Configurazione di programma della vetrina enterprise da seed/ via API (F2-DIST-09, ADR-049, Q-617): hub finto, senza rete.
      - run: node --test scripts/vetrina-programma.test.mjs
      # Overlay di vetrina del compose di riferimento (F2-DIST-03, F2-DIST-09, ADR-049, M8.14c): segreti solo da file,
      # TLS verso bus e database, porte, vetrina.sh (provisioning in una cartella temporanea) e operatori.py contro un
      # Keycloak simulato. Il compose unito si prova con il docker compose del runner.
      - run: node --test scripts/check-vetrina.mjs
      # Smoke enterprise (F2-QA-04, ADR-049, M8.14 V6): login con cambio password e OTP, CSRF, audit e modo vetrina
      # contro un BFF, un Keycloak e un hub finti; nessuna rete fuori da loopback.
      - run: node --test scripts/smoke-enterprise.test.mjs
      # Realm Keycloak as code (F2-IAM-01, ADR-027): scope referenziati definiti, nessun segreto letterale,
      # segnaposto passati al servizio idp del compose.
      - run: node --test scripts/check-realm.mjs

  # Chart Helm e compose, di riferimento e locale (F2-DIST-02/03, M8.3, Q-483). Controllo obbligatorio del ruleset
  # (scripts/setup-branch-protection.sh): gira quando cambiano chart, compose, immagine o la verifica, e sempre su main;
  # saltato conta come superato. helm, kubeconform e promtool a versione fissa;
  # con CI=true scripts/check-helm.mjs fallisce se helm, kubeconform o promtool mancano (nessuna prova saltata che conta come superata).
  helm:
    name: helm (chart e compose)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.18.4
      KUBECONFORM_VERSION: v0.7.0
      # promtool (regole SLO e allarmi, M8.6a): binario ufficiale a versione fissa, verificato con lo sha256 del rilascio.
      PROMETHEUS_VERSION: 3.13.3
      PROMETHEUS_SHA256: b349c732d8a853e657d0e7ae1bbad4d11b586615fb65fdc59d896b9f869c001e
      KUBE_VERSION: 1.31.0
      # Schemi dei CRD (Strimzi, CloudNativePG, Gateway API) a un commit fisso del catalogo.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      # go install verifica il modulo con il checksum database di Go: niente binari scaricati senza verifica.
      - name: kubeconform
        run: |
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Il rilascio non è firmato: lo sha256 fissato sopra è l'unica garanzia sul binario, quindi il confronto blocca il job.
      - name: promtool
        run: |
          set -euo pipefail
          base="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -sSLfo /tmp/prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${base}.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prom.tgz" | sha256sum -c
          tar xzf /tmp/prom.tgz -C /tmp "${base}/promtool"
          sudo install "/tmp/${base}/promtool" /usr/local/bin/
      - name: Verifiche statiche, helm lint e scenari di helm template
        run: node --test scripts/check-helm.mjs
      - name: Manifest validi (default con gateway, servizi gestiti)
        run: |
          # pipefail: un `helm template` fallito non deve passare perché kubeconform riceve un input vuoto.
          set -euo pipefail
          chart=deploy/helm/loyaltyhub
          helm template lh "$chart" --kube-version "$KUBE_VERSION" -f "$chart/ci/lint-values.yaml" \
            --set gateway.enabled=true --set 'gateway.parentRefs[0].name=gw' \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                -schema-location default -schema-location "$CRD_SCHEMAS" -
          # Valori del job `helm install (kind)`: Strimzi v1, CloudNativePG e HTTPRoute.
          helm template lh "$chart" --kube-version "$KUBE_VERSION" -n lh -f "$chart/ci/kind-values.yaml" \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                -schema-location default -schema-location "$CRD_SCHEMAS" -
          helm template lh "$chart" --kube-version "$KUBE_VERSION" -f "$chart/ci/lint-values.yaml" \
            --set postgres.mode=external --set postgres.external.host=pg.example.internal \
            --set kafka.mode=external --set kafka.external.bootstrapServers=kafka.example.internal:9093 \
            --set kafka.external.sasl.username.name=lh-kafka --set kafka.external.sasl.password.name=lh-kafka \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" -schema-location default -
      - name: Compose di riferimento valido
        run: LH_IMAGE=ghcr.io/example/loyaltyhub:ci docker compose -f deploy/compose/reference.yml config -q
      - name: Compose di riferimento con l'overlay di vetrina valido (M8.14c)
        run: >-
          LH_IMAGE=ghcr.io/example/loyaltyhub:ci LH_VETRINA_DIR=/etc/loyaltyhub-vetrina
          LH_VETRINA_WEB_HOST=web-vetrina.example.org LH_VETRINA_IDP_HOST=idp-vetrina.example.org
          LH_VETRINA_PUBLIC_ADDRESS=10.0.0.10
          docker compose -f deploy/compose/reference.yml -f deploy/vetrina/compose.vetrina.yml config -q
      - name: Compose di riferimento con l'overlay dello smoke enterprise valido (M8.14 V6)
        run: >-
          LH_IMAGE=ghcr.io/example/loyaltyhub:ci LH_CI_UID=1001 LH_CI_GID=1001 LH_CI_TLS_DIR=/tmp/lh-smoke-enterprise/tls
          docker compose -f deploy/compose/reference.yml -f deploy/compose/ci/smoke-enterprise.yml config -q
      - name: Compose locale valido (tutti i profili)
        run: docker compose -f deploy/docker-compose.yml --profile all --profile idp --profile idp-test config -q

  # Installazione reale del chart (criterio di accettazione di M8, docs/18 §6; F2-DIST-02, Q-490): cluster kind a un
  # nodo, operatori Strimzi e CloudNativePG, Envoy Gateway per la Gateway API, immagine unica costruita qui e caricata
  # nel nodo. Attende Kafka, Postgres, i topic e i Pod di tutti i ruoli (hub, web, idp) Ready, poi esegue
  # scripts/smoke.sh attraverso il gateway (HTTPRoute del chart). Profilo demo: lo smoke non ha un token OIDC
  # (SPEC-GAP: Q-491, TOBE-008). Controllo consultivo: NON è nel ruleset (scripts/setup-branch-protection.sh) finché
  # non si dimostra stabile. Versioni fisse; il nodo usa Kubernetes 1.36, supportato da Strimzi 1.2 (1.30 o
  # successivo), CloudNativePG 1.30 (1.34–1.36) ed Envoy Gateway 1.9 (1.33–1.36).
  helm-kind:
    name: helm install (kind)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HELM_VERSION: v3.18.4
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.36.4
      KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      # Strimzi 1.2.0: solo API v1, Kafka 4.2.0…4.3.1 (il chart chiede 0.51 o successivo, Q-490).
      STRIMZI_VERSION: 1.2.0
      # Chart 0.29.1 = operatore CloudNativePG 1.30.1.
      CNPG_CHART_VERSION: 0.29.1
      ENVOY_GATEWAY_VERSION: v1.9.2
      NS: lh
      RELEASE: lh
    steps:
      # Build dell'immagine, nodo kind e immagini di Kafka, Postgres e Keycloak occupano gran parte del disco del runner:
      # si tolgono i toolchain preinstallati che il job non usa.
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      # Node per scripts/smoke.sh (legge il JSON senza jq).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v4
      # Stessa build di .github/workflows/image.yml (solo amd64, nessun push); l'immagine finisce nel Docker del runner.
      - name: Immagine unica
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          # Nessuna attestazione: `kind load docker-image` vuole un'immagine semplice, non un indice con attestazioni.
          provenance: false
          sbom: false
          tags: lh-image:ci
      - name: Cluster kind
        uses: helm/kind-action@v1.15.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: lh
          wait: 120s
      - name: Nodo, namespace e immagine
        run: |
          # La rack awareness di Strimzi (spec.kafka.rack) legge l'etichetta di zona del nodo: senza, il container di
          # init del broker esce con errore. I nodi dei cloud ce l'hanno già.
          kubectl label nodes --all topology.kubernetes.io/zone=zone-a
          # Il chart dichiara Pod compatibili con Pod Security `restricted` (docs/18 §3.10): qui è imposto.
          kubectl create namespace "$NS"
          kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=restricted
          kind load docker-image lh-image:ci --name lh
          # L'immagine ora è nel nodo: la cache di build non serve più.
          docker buildx prune --all --force > /dev/null
          df -h /
      - name: Operatori (Strimzi, CloudNativePG) ed Envoy Gateway
        run: |
          # Come in deploy/README.md: Strimzi guarda tutti i namespace e genera Pod `restricted`.
          helm install strimzi strimzi-kafka-operator --repo https://strimzi.io/charts/ --version "$STRIMZI_VERSION" \
            -n strimzi --create-namespace --set watchAnyNamespace=true \
            --set 'extraEnvs[0].name=STRIMZI_POD_SECURITY_PROVIDER_CLASS' --set 'extraEnvs[0].value=restricted' \
            --wait --timeout 10m
          helm install cnpg cloudnative-pg --repo https://cloudnative-pg.github.io/charts --version "$CNPG_CHART_VERSION" \
            -n cnpg-system --create-namespace --wait --timeout 10m
          # Envoy Gateway porta anche i CRD della Gateway API, che servono all'HTTPRoute del chart.
          helm install eg oci://docker.io/envoyproxy/gateway-helm --version "$ENVOY_GATEWAY_VERSION" \
            -n envoy-gateway-system --create-namespace --wait --timeout 10m
          kubectl get crd kafkas.kafka.strimzi.io -o jsonpath='{range .spec.versions[*]}{.name} served={.served}{"\n"}{end}'
      - name: Gateway
        run: |
          # Nessun LoadBalancer in kind: il Service di Envoy è ClusterIP e lo smoke lo raggiunge con un port-forward.
          kubectl apply -f - <<EOF
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: EnvoyProxy
          metadata:
            name: cluster-ip
            namespace: envoy-gateway-system
          spec:
            provider:
              type: Kubernetes
              kubernetes:
                envoyService:
                  type: ClusterIP
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: eg
          spec:
            controllerName: gateway.envoyproxy.io/gatewayclass-controller
            parametersRef:
              group: gateway.envoyproxy.io
              kind: EnvoyProxy
              name: cluster-ip
              namespace: envoy-gateway-system
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: lh-gateway
            namespace: $NS
          spec:
            gatewayClassName: eg
            listeners:
              - name: http
                protocol: HTTP
                port: 80
          EOF
          kubectl -n "$NS" wait gateway/lh-gateway --for=condition=Programmed --timeout=5m
      - name: Secret (generati nel job, mai stampati)
        run: |
          kubectl -n "$NS" create secret generic lh-idp-admin --from-literal=password="$(openssl rand -hex 24)"
          kubectl -n "$NS" create secret generic lh-idp-clients \
            --from-literal=web-client-secret="$(openssl rand -hex 32)" \
            --from-literal=portal-client-secret="$(openssl rand -hex 32)" \
            --from-literal=widgets-client-secret="$(openssl rand -hex 32)" \
            --from-literal=cms-client-secret="$(openssl rand -hex 32)"
          kubectl -n "$NS" create secret generic lh-idp-db --type=kubernetes.io/basic-auth \
            --from-literal=username=idp --from-literal=password="$(openssl rand -hex 24)"
      - name: helm install
        timeout-minutes: 22
        run: |
          # Senza --wait: Helm attende il Job di migrazione (hook post-install, che aspetta il Secret di CloudNativePG);
          # Kafka, Postgres e Pod si attendono nei passi successivi, con messaggi più chiari.
          helm install "$RELEASE" deploy/helm/loyaltyhub -n "$NS" -f deploy/helm/loyaltyhub/ci/kind-values.yaml \
            --timeout 20m
      - name: Strimzi e CloudNativePG provisionati
        timeout-minutes: 25
        run: |
          kubectl -n "$NS" wait "kafka/$RELEASE-loyaltyhub-kafka" --for=condition=Ready --timeout=12m
          kubectl -n "$NS" wait kafkatopic --all --for=condition=Ready --timeout=3m
          kubectl -n "$NS" wait "cluster.postgresql.cnpg.io/$RELEASE-loyaltyhub-pg" --for=condition=Ready --timeout=6m
          kubectl -n "$NS" wait "database.postgresql.cnpg.io/$RELEASE-loyaltyhub-pg-idp" \
            --for=jsonpath='{.status.applied}'=true --timeout=3m
          kubectl -n "$NS" get kafka,kafkanodepool,kafkatopic,cluster.postgresql.cnpg.io,database.postgresql.cnpg.io
      - name: Pod di tutti i ruoli Ready
        timeout-minutes: 20
        run: |
          for role in hub web idp; do
            kubectl -n "$NS" rollout status "deployment/$RELEASE-loyaltyhub-$role" --timeout=15m
          done
          kubectl -n "$NS" wait pod --for=condition=Ready --timeout=3m \
            -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component in (hub,web,idp)"
          kubectl -n "$NS" get pods -o wide
      - name: Smoke attraverso il gateway
        run: |
          svc=$(kubectl -n envoy-gateway-system get svc -o jsonpath='{.items[0].metadata.name}' \
            -l "gateway.envoyproxy.io/owning-gateway-namespace=$NS,gateway.envoyproxy.io/owning-gateway-name=lh-gateway")
          kubectl -n envoy-gateway-system port-forward "service/$svc" 8888:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          # smoke.sh usa gli URL pubblici delle API: curl apre la connessione verso il port-forward ma manda
          # Host: api.example.org, l'host dell'HTTPRoute (gateway.host). Senza la route giusta Envoy risponde 404.
          mkdir -p "$RUNNER_TEMP/curl"
          echo 'connect-to = "api.example.org:80:127.0.0.1:8888"' > "$RUNNER_TEMP/curl/.curlrc"
          export CURL_HOME="$RUNNER_TEMP/curl"
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 5 http://api.example.org/v1/portal/wallets/MBR-000003; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Il gateway non instrada /v1 verso l'hub dopo 30 tentativi"
            cat "$RUNNER_TEMP/port-forward.log"
            kubectl -n "$NS" get httproute -o yaml
            exit 1
          fi
          BASE_INGESTION=http://api.example.org BASE_WALLET=http://api.example.org DEADLINE_S=60 bash scripts/smoke.sh
      # Anche con uno step scaduto o annullato (timeout-minutes dei passi lunghi, sotto quello del job).
      - name: Diagnostica
        if: ${{ !success() }}
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 150
          kubectl -n "$NS" get kafka,kafkanodepool,kafkatopic,cluster.postgresql.cnpg.io,database.postgresql.cnpg.io,gateway,httproute \
            -o yaml
          kubectl -n "$NS" get jobs -o wide
          kubectl -n "$NS" describe pods
          for role in hub web idp; do
            echo "::group::log $role"
            kubectl -n "$NS" logs "deployment/$RELEASE-loyaltyhub-$role" --all-containers --tail=300
            echo "::endgroup::"
          done
          echo "::group::log migrate"
          kubectl -n "$NS" logs -l "app.kubernetes.io/component=migrate" --all-containers --tail=300 --prefix
          echo "::endgroup::"
          echo "::group::log Kafka"
          kubectl -n "$NS" logs -l "strimzi.io/cluster=$RELEASE-loyaltyhub-kafka" --all-containers --tail=200 --prefix
          echo "::endgroup::"
          echo "::group::log operatori"
          kubectl -n strimzi logs deployment/strimzi-cluster-operator --tail=300
          kubectl -n cnpg-system logs -l app.kubernetes.io/name=cloudnative-pg --tail=300 --prefix
          kubectl -n envoy-gateway-system logs deployment/envoy-gateway --tail=200
          kubectl -n envoy-gateway-system logs -l gateway.envoyproxy.io/owning-gateway-name=lh-gateway --all-containers \
            --tail=200 --prefix
          echo "::endgroup::"
          cat "$RUNNER_TEMP/port-forward.log"

  # Smoke enterprise con login OIDC reale (F2-QA-04, M8.2, ADR-049, M8.14 V6; criterio di M8.14: «il job CI sul compose
  # con l'overlay di test del realm esegue un login OIDC reale di un operatore, una scrittura di configurazione che
  # lascia una voce in GET /v1/audit con l'attore reale, 401 senza token e 404 PERSONA_DISABLED su POST /api/persona»).
  # Compose di riferimento in profilo enterprise con l'immagine di questo commit, l'overlay di CI
  # (deploy/compose/ci/smoke-enterprise.yml: proxy TLS con una CA di prova, LDAP di prova) e l'overlay di test del
  # realm; scripts/smoke-enterprise.sh genera segreti e certificati nel job (file 0600, mascherati, mai stampati) e
  # scripts/smoke-enterprise.mjs fa il login dal client `web` di produzione con PKCE, cambio della password
  # temporanea e OTP (nessun direct access grant). Controllo consultivo: NON è nel ruleset
  # (scripts/setup-branch-protection.sh) finché non si dimostra stabile, come `helm install (kind)`.
  smoke-enterprise:
    name: smoke enterprise (compose, OIDC)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v4
      # Stessa build di .github/workflows/image.yml (solo amd64, nessun push); l'immagine finisce nel Docker del runner.
      - name: Immagine unica
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: lh-image:ci
      # Il proxy di prova serve web.lh.test e idp.lh.test su 127.0.0.1:8443: gli stessi URL https per il runner e per
      # i container (alias di rete del proxy), come nella vetrina (Q-420).
      - name: Nomi del proxy di prova
        run: echo "127.0.0.1 web.lh.test idp.lh.test" | sudo tee -a /etc/hosts
      - name: Compose enterprise con l'overlay di test del realm
        timeout-minutes: 25
        run: bash scripts/smoke-enterprise.sh up
      - name: Smoke enterprise con login OIDC reale
        timeout-minutes: 10
        run: bash scripts/smoke-enterprise.sh run
      - name: Diagnostica
        if: ${{ !success() }}
        run: bash scripts/smoke-enterprise.sh logs
      - name: Smonta
        if: always()
        run: bash scripts/smoke-enterprise.sh down

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Storia completa con rami e tag: check-api confronta con il merge-base del ramo base, check-contracts con l'ultimo tag `v<numero>` e col merge-base (fetch-depth: 0 scarica anche i tag).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Contratti evento (docs/05 §9, ADR-028, F2-EVT-01, M8.4): gate strutturale e compatibilità con l'ultimo tag `v<numero>` e col merge-base,
      # senza dipendenze npm. La validazione JSON Schema completa è in ContractsTest (job backend).
      - run: node --test scripts/contracts-compat.test.mjs
      - name: Contratti evento compatibili con l'ultimo tag e col ramo base
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-contracts.mjs "--pr-labels=$PR_LABELS"
      # API HTTP (M8.8, docs/18 §3.6): solo modifiche compatibili rispetto al ramo base. Il drift tra codice e
      # contracts/api/ lo verifica OpenApiExportIT nel job backend.
      - run: npm --prefix scripts ci --omit=dev
      - run: node --test scripts/check-api.test.mjs
      - name: API compatibili col ramo base
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-api.mjs "--pr-labels=$PR_LABELS"

  docker:
    name: docker (solo main)
    if: github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Piano A: build senza push (docs/11 §10). Path-filter per servizio: da affinare quando ci sono più immagini.
      - name: Build immagine ingestion (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/ingestion-service/Dockerfile
          push: false
          tags: lh-ingestion:ci

  e2e:
    name: e2e (manuale)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Valida compose
        run: docker compose -f deploy/docker-compose.yml --profile all config >/dev/null
      - name: Sintassi degli script E2E
        run: bash -n scripts/smoke.sh && bash -n scripts/wake.sh
      # Il run completo (compose --profile all up + wake + smoke) richiede un ambiente con accesso a
      # Docker Hub; si aggiunge al deploy (M1.8) su un runner con i registri raggiungibili.
      # Localmente: docker compose -f deploy/docker-compose.yml --profile all up --build
      #             scripts/wake.sh && scripts/smoke.sh
