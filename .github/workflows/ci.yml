name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

# Una sola esecuzione per branch: i push successivi annullano quella in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: Java services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f services/pom.xml verify
      - uses: actions/upload-artifact@v4
        with: { name: jars, path: services/*/target/*.jar, retention-days: 1 }
  design-system:
    name: Design system del backoffice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web and CMS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: BFF
        run: node --check web/bff/src/server.js
      - name: Sito Next.js
        run: cd web/site && npm ci --no-audit --no-fund && npm run build
      - name: Backoffice Payload
        run: cd cms && npm ci --no-audit --no-fund && npm run typecheck && npm run generate:importmap && npm run build
  deploy:
    name: Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/loyalty-hub -f deploy/helm/loyalty-hub/values-dev.yaml
      - run: helm template lh deploy/helm/loyalty-hub -f deploy/helm/loyalty-hub/values-dev.yaml > /tmp/rendered.yaml && wc -l /tmp/rendered.yaml
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.13.3" }
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false && terraform -chdir=deploy/terraform validate
  observability:
    name: Osservabilità e BI (RF-119, RF-120)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz --strip-components=1 --wildcards '*/promtool'
          ./promtool check rules deploy/observability/local/rules.yaml
          ./promtool check config deploy/observability/local/prometheus.yml
      - name: Dashboard e values validi
        run: |
          for f in deploy/observability/dashboards/*.json; do python3 -c "import json; json.load(open('$f'))"; done
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('deploy/observability/*.yaml')+glob.glob('deploy/bi/superset.values.yaml')]; list(yaml.safe_load_all(open('deploy/bi/clickhouse.values.yaml')))"
          python3 -m py_compile analytics/superset/superset_config.py
      - name: Schema ClickHouse (nodo singolo)
        run: |
          docker run -d --name ch -e CLICKHOUSE_DB=loyalty clickhouse/clickhouse-server:25.8
          sleep 15
          sed 's/kafka:9092/localhost:9092/' analytics/clickhouse/local/init.sql | docker exec -i ch clickhouse-client --multiquery

  shell:
    name: Script di shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # shellcheck è preinstallato sui runner ubuntu-latest.
      - run: shellcheck --severity=style scripts/*.sh
