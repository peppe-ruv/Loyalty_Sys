name: collaudo

# Livello 3 della strategia di test (ADR-052 decisione 3, Q-683, M9 T3, F2-QA-06): alza lo stack `enterprise` di
# riferimento con l'overlay di test del realm, esegue le journey Playwright e allega come artefatto i log di tutti i
# container (`docker compose logs --timestamps`, un file per container), conservati 14 giorni. Stesso allestimento del
# job `e2e-pr` di ci.yml. A mano e sui tag di major release (`v*.0.0`). I log vengono dallo stack di CI, mai dalla
# vetrina (nessun endpoint pubblico dei log, ADR-052 decisione 4).
#
# Regola 20: i log non contengono dati personali né credenziali; prima del caricamento li controlla gitleaks
# (--redact: il valore non compare mai nel log del job). Se trova qualcosa i log NON si caricano e il job fallisce.
# Nessun valore sensibile nel riepilogo; mai `set -x`.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.0.0"

# Minimo privilegio per il GITHUB_TOKEN: serve solo il checkout.
permissions:
  contents: read

# Una corsa alla volta: lo stack usa porte fisse (8443, 8080, 8180).
concurrency:
  group: collaudo
  cancel-in-progress: false

jobs:
  collaudo:
    name: collaudo (stack enterprise, log dei container)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Il contesto `runner` non esiste a livello di job: LOG_DIR si fissa nel primo passo.
      - name: Cartella dei log
        run: echo "LOG_DIR=${RUNNER_TEMP}/collaudo-log" >> "$GITHUB_ENV"
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v4
      # Stessa build di .github/workflows/image.yml (solo amd64, nessun push); l'immagine finisce nel Docker del runner.
      - name: Immagine unica
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: lh-image:ci
      - name: Nomi del proxy di prova
        run: echo "127.0.0.1 web.lh.test idp.lh.test" | sudo tee -a /etc/hosts
      - name: Compose enterprise con l'overlay di test del realm
        timeout-minutes: 25
        run: bash scripts/smoke-enterprise.sh up
      - name: Dipendenze dell'harness
        working-directory: e2e
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: pnpm install --frozen-lockfile
      - name: Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Journey Playwright
        id: journeys
        timeout-minutes: 15
        working-directory: e2e
        run: pnpm test
      # Da qui in poi i passi girano anche se le journey falliscono: i log servono proprio allora.
      - name: Log dei container
        id: dump
        if: ${{ always() }}
        run: bash scripts/smoke-enterprise.sh dump "$LOG_DIR"
      - name: Installa gitleaks
        if: ${{ always() }}
        # Stessa release fissata, con SHA-256 verificato, del job `security` di ci.yml. Per aggiornare: cambia le due
        # variabili. Nessuna azione di terze parti.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "${tmp}" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
          rm -rf "${tmp}"
          gitleaks version
      - name: Segreti nei log (gitleaks)
        id: gitleaks
        if: ${{ always() && steps.dump.outcome == 'success' }}
        # --redact: il valore del segreto non compare mai nel log del job. Configurazione ed eccezioni: .gitleaks.toml.
        run: |
          set +e
          gitleaks dir --config .gitleaks.toml --redact --no-banner "$LOG_DIR"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks ha segnalato qualcosa nei log dei container (codice ${rc}): i log NON vengono caricati. Si ripuliscono alla fonte (regola 20), poi si rilancia."
            rm -rf "$LOG_DIR"
            exit 1
          fi
          echo "gitleaks: nessuna segnalazione nei log."
      - name: Carica i log dei container
        id: upload-logs
        if: ${{ always() && steps.gitleaks.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: collaudo-log-${{ github.run_id }}
          path: ${{ runner.temp }}/collaudo-log/
          retention-days: 14
          if-no-files-found: error
      # Il report HTML e le tracce dei test (la sessione dell'operatore sta fuori da queste cartelle).
      - name: Report Playwright
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: collaudo-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            !e2e/test-results/**/*-setup/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Riepilogo
        if: ${{ always() }}
        env:
          JOURNEYS: ${{ steps.journeys.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          UPLOAD: ${{ steps.upload-logs.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          containers="$(find "$LOG_DIR" -maxdepth 1 -name '*.log' 2>/dev/null | wc -l | tr -d ' ')"
          {
            echo "## Collaudo, stack enterprise (ADR-052, Q-683)"
            echo
            echo "| Voce | Esito |"
            echo "| --- | --- |"
            echo "| Journey Playwright | ${JOURNEYS} |"
            echo "| Container con i log | ${containers} |"
            echo "| gitleaks sui log | ${GITLEAKS} |"
            if [ "$UPLOAD" = "success" ]; then
              echo "| Artefatto dei log | \`collaudo-log-${RUN_ID}\` (14 giorni) |"
            else
              echo "| Artefatto dei log | non caricato |"
            fi
            echo "| Report Playwright | \`collaudo-report-${RUN_ID}\` |"
            if [ "$GITLEAKS" = "failure" ]; then
              echo
              echo "> gitleaks ha segnalato qualcosa: i log sono stati eliminati dal runner e non caricati (regola 20)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smonta
        if: ${{ always() }}
        run: bash scripts/smoke-enterprise.sh down
