name: Build and Release Image

on:
  pull_request:
    paths:
      - 'deploy/image/**'
      - '.github/workflows/image.yml'
      - 'web/**'
      - 'deploy/hub/**'
      - 'services/**'
      - 'libs/**'
      - 'contracts/**'
      - 'seed/**'
      - '.dockerignore'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (linux/amd64 only) on PR
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: lh-image:test

      - name: Start Compose for Smoke Test
        if: github.event_name == 'pull_request'
        run: |
          docker compose -f deploy/docker-compose.yml up -d kafka postgres
          # Wait for Postgres
          until docker exec lh-postgres pg_isready -U loyaltyhub -d loyaltyhub; do sleep 2; done
          # Wait for Kafka
          until docker exec lh-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list; do sleep 2; done

      - name: Smoke Run LH_ROLE=hub
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name lh-hub \
            --network deploy_default \
            -e LH_ROLE=hub \
            -e LH_PROFILE=demo \
            -e LH_MODE=external \
            -e SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092 \
            -e DB_URL_DIRECT=jdbc:postgresql://postgres:5432/loyaltyhub \
            -e DB_USERNAME=loyaltyhub \
            -e DB_PASSWORD=loyaltyhub \
            lh-image:test

          # Wait until actuator health is UP
          for i in {1..30}; do
            if docker run --network deploy_default curlimages/curl -s http://lh-hub:8080/actuator/health | grep '"status":"UP"'; then
               echo "Healthcheck passed"
               exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed"
          docker logs lh-hub
          exit 1

      - name: Build and Push Multi-arch on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loyaltyhub:latest,ghcr.io/${{ github.repository_owner }}/loyaltyhub:${{ github.ref_name }}
