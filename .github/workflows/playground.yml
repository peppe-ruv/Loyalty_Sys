# Pubblicazione del playground su Vercel.
#
# Il playground è un sito statico: viene costruito qui e caricato già pronto (`--prebuilt`), così
# Vercel non deve installare né compilare nulla e il risultato pubblicato è esattamente quello che
# la CI ha verificato.
#
# Serve un solo segreto: VERCEL_TOKEN (Vercel → Account Settings → Tokens). Senza, il job si salta
# da solo invece di fallire: chi lavora sul repository senza il token non vede rosso per questo.
name: Playground

on:
  push:
    branches: [main]
    paths:
      - 'web/playground/**'
      - 'web/backoffice-design-system/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Costruisci e pubblica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Identificativi del progetto Vercel: non sono segreti, ma restano sovrascrivibili dalle
      # variabili del repository per chi pubblica su un altro account.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_DL35UVwS7JBjF3BpxNBGFDZh' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_LGKp9uCKS1rebq7INC8qMFVEWVQN' }}
    steps:
      - uses: actions/checkout@v4

      - name: Token configurato?
        id: token
        run: echo "presente=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.presente != 'true'
        run: |
          echo "::notice::VERCEL_TOKEN non configurato: pubblicazione saltata."
          echo "Aggiungi il segreto VERCEL_TOKEN per pubblicare il playground." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.presente == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Costruisci design system e playground
        if: steps.token.outputs.presente == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @loyalty-hub/backoffice-design-system
          npm run build --workspace @loyalty-hub/playground

      - name: Pubblica su Vercel
        if: steps.token.outputs.presente == 'true'
        working-directory: web/playground
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Playground pubblicato: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
