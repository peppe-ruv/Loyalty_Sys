name: smoke-demo

# Prova di fumo sulla demo online (docs/12 §4, DoD "demo online aggiornata e smoke.sh verde"). Solo manuale: scrive
# un acquisto vero sui dati della demo (un accredito al membro scelto), quindi si lancia con consapevolezza.
# Sveglia l'hub (piano gratuito: si addormenta dopo 15 minuti), poi esegue scripts/smoke.sh contro l'hub consolidato,
# che espone ingestion e wallet sullo stesso indirizzo. Costo zero: solo minuti di Actions.
on:
  workflow_dispatch:
    inputs:
      member:
        description: "Membro su cui provare l'accredito"
        default: "MBR-000002"
      amount:
        description: "Importo dell'acquisto in euro"
        default: "20"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUB_URL: ${{ vars.LH_HUB_URL || 'https://loyalty-hub-6dc3.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sveglia l'hub
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$HUB_URL/actuator/health/liveness" >/dev/null; then echo "hub sveglio"; exit 0; fi
            echo "hub non ancora sveglio ($i/40)…"; sleep 15
          done
          echo "l'hub non si è svegliato entro 10 minuti" >&2; exit 1
      - name: smoke.sh
        env:
          BASE_INGESTION: ${{ env.HUB_URL }}
          BASE_WALLET: ${{ env.HUB_URL }}
          MEMBER: ${{ inputs.member }}
          AMOUNT: ${{ inputs.amount }}
          DEADLINE_S: "15"
        run: bash scripts/smoke.sh
