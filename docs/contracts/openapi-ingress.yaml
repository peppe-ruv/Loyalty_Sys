openapi: 3.1.0
info:
  title: Loyalty Hub - Ingresso azioni premianti
  version: 1.0.0
  description: Contratto REST per le fonti esterne (RI-04, RI-05). Risponde 202 in ogni caso; gli esiti per elemento sono nel corpo.
servers:
  - url: https://loyalty.example.it
security:
  - oauth2: [loyalty.ingest]
  - hmac: []
paths:
  /v1/actions:
    post:
      summary: Invia un batch di azioni premianti (max 500)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngressBatch' }
      responses:
        '202':
          description: Batch accettato; esito per elemento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResult' }
        '400': { description: Corpo non valido }
        '401': { description: Autenticazione fallita }
        '429': { description: Rate limit per fonte superato }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://iam.example.it/oauth2/token
          scopes: { loyalty.ingest: Invio azioni premianti }
    hmac:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 su corpo + timestamp (header X-Timestamp), chiave per partner
  schemas:
    RewardingAction:
      type: object
      required: [actionType, idempotencyKey, occurredAt]
      properties:
        actionType: { type: string, example: BILL_PAID_ON_TIME }
        idempotencyKey: { type: string, pattern: '^[a-z0-9-]{2,32}:[A-Za-z0-9._-]{1,128}:[A-Z0-9_]{1,64}$', example: 'sap:INV-2026-000123:PAID' }
        externalRef: { type: string }
        occurredAt: { type: string, format: date-time }
        reversalOf: { type: string, description: Chiave dell'azione da stornare (RI-08) }
        attributes: { type: object, additionalProperties: true }
    IngressItem:
      type: object
      required: [memberId, action]
      properties:
        memberId: { type: string, description: sub OIDC del membro (RI-02) }
        action: { $ref: '#/components/schemas/RewardingAction' }
    IngressBatch:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/IngressItem' } }
    BatchResult:
      type: object
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              idempotencyKey: { type: string }
              status: { type: string, enum: [ACCEPTED, DUPLICATE, REJECTED] }
              reason: { type: string, nullable: true }
