        balances: {}
        movements: {}
        redemptions: {}
        plays: {}
        generatedAt:
          type: "string"
          format: "date-time"
    ActiveMemberRule:
      type: "object"
      properties:
        days:
          type: "integer"
          format: "int32"
        actionTypes:
          type: "array"
          items:
            type: "string"
    CardGenerator:
      type: "object"
      properties:
        enabled:
          type: "boolean"
        format:
          type: "string"
          enum:
          - "ALPHANUMERIC"
          - "LETTERS"
          - "DIGITS"
        length:
          type: "integer"
          format: "int32"
        prefix:
          type: "string"
    Identifier:
      type: "object"
      properties:
        kind:
          type: "string"
          enum:
          - "OIDC_SUB"
          - "CRM_ID"
          - "SAP_BP"
          - "EMAIL"
          - "PHONE"
          - "LOYALTY_CARD"
        required:
          type: "boolean"
        unique:
          type: "boolean"
        matching:
          type: "boolean"
    MemberIdentifiers:
      type: "object"
      properties:
        priority:
          type: "array"
          items:
