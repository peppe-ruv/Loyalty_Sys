        granted:
          type: "boolean"
        source:
          type: "string"
        legalBasis:
          type: "string"
        version:
          type: "string"
        grantedAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        evidence:
          type: "string"
    Update:
      type: "object"
      properties:
