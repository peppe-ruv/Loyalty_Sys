          enum:
          - "MEMBER"
          - "CAMPAIGN"
          - "REWARD"
          - "WHEEL"
          - "TRANSACTION"
        group:
          type: "string"
        name:
          type: "string"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/Field"
        repeatable:
          type: "boolean"
        editRole:
          type: "string"
    Field:
      type: "object"
      properties:
        name:
          type: "string"
        type:
          type: "string"
          enum:
          - "STRING"
          - "NUMBER"
          - "BOOLEAN"
          - "DATE"
          - "SINGLE_SELECT"
          - "MULTI_SELECT"
        required:
          type: "boolean"
        maxLength:
          type: "integer"
          format: "int32"
        regex:
          type: "string"
        min:
          type: "number"
          format: "double"
        max:
          type: "number"
          format: "double"
        collection:
          type: "string"
    Purpose:
      type: "object"
