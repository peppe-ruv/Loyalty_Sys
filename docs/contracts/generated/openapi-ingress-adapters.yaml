components:
  schemas:
    Definition:
      type: "object"
      properties:
        code:
          type: "string"
          minLength: 1
        campaign:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          minLength: 1
        validFrom:
          type: "string"
          format: "date-time"
        validTo:
          type: "string"
          format: "date-time"
        maxUses:
          type: "integer"
          format: "int32"
        maxUsesPerMember:
          type: "integer"
          format: "int32"
        active:
          type: "boolean"
      required:
      - "campaign"
      - "code"
      - "kind"
    Redeem:
      type: "object"
      properties:
        memberId:
          type: "string"
          minLength: 1
        code:
          type: "string"
          minLength: 1
        channel:
          type: "string"
      required:
      - "code"
      - "memberId"
    CheckIn:
      type: "object"
      properties:
        memberId:
          type: "string"
          minLength: 1
        placeId:
          type: "string"
          minLength: 1
        lat:
          type: "number"
          format: "double"
        lon:
          type: "number"
          format: "double"
        channel:
          type: "string"
      required:
      - "memberId"
      - "placeId"
    IngressBatch:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/IngressItem"
          maxItems: 500
          minItems: 1
      required:
      - "items"
    IngressItem:
      type: "object"
      properties:
        memberId:
          type: "string"
          minLength: 1
        action:
          $ref: "#/components/schemas/RewardingAction"
      required:
      - "action"
      - "memberId"
    RewardingAction:
      type: "object"
      properties:
        actionType:
          type: "string"
          minLength: 1
        idempotencyKey:
          type: "string"
          minLength: 1
        externalRef:
          type: "string"
        occurredAt:
          type: "string"
          format: "date-time"
        reversalOf:
          type: "string"
        attributes:
          type: "object"
          additionalProperties: {}
        reversal:
          type: "boolean"
      required:
      - "actionType"
      - "idempotencyKey"
      - "occurredAt"
    BatchResult:
      type: "object"
      properties:
        accepted:
          type: "integer"
          format: "int32"
        duplicates:
          type: "integer"
          format: "int32"
        rejected:
          type: "integer"
          format: "int32"
        failed:
          type: "integer"
          format: "int32"
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/ItemResult"
    ItemResult:
      type: "object"
      properties:
        idempotencyKey:
          type: "string"
        status:
          type: "string"
        reason:
          type: "string"
    Attribute:
      type: "object"
      properties:
        name:
          type: "string"
        type:
          type: "string"
          enum:
          - "BOOLEAN"
          - "DATETIME"
          - "NUMBER"
          - "TEXT"
          - "LIST"
        required:
          type: "boolean"
        description:
          type: "string"
    EventSchema:
      type: "object"
      properties:
        actionType:
          type: "string"
        name:
          type: "string"
        version:
          type: "integer"
          format: "int32"
        active:
          type: "boolean"
        lenient:
          type: "boolean"
        attributes:
          type: "array"
          items:
            $ref: "#/components/schemas/Attribute"
    Product:
      type: "object"
      properties:
        sku:
          type: "string"
        name:
          type: "string"
        category:
          type: "string"
        brand:
          type: "string"
        price:
          type: "number"
        labels:
          type: "array"
          items:
            type: "string"
        attributes:
          type: "object"
          additionalProperties:
            type: "string"
        active:
          type: "boolean"
