spring:
  application:
    name: read-model
  data:
    # In compose e su Kubernetes l'host arriva da SPRING_DATA_REDIS_HOST; REDIS_HOST resta come alias locale.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty}
    username: ${DB_USER:loyalty}
    password: ${DB_PASSWORD:loyalty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: readmodel
    default-schema: readmodel
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: read-model
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

server:
  port: 8088
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      service: read-model
  # RF-118: tracing distribuito e metriche con etichette comuni; l'endpoint OTLP arriva dall'ambiente (OTEL_EXPORTER_OTLP_ENDPOINT)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.2}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      application: read-model
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
    export:
      prometheus:
        enabled: true
logging:
  structured:
    format:
      console: ecs

# Cache del Customer 360 e ricalcolo delle finestre mobili (RF-125)
readmodel:
  cache:
    ttl-seconds: ${CONTEXT_CACHE_TTL:300}
  recompute:
    enabled: ${CONTEXT_RECOMPUTE_ENABLED:true}
    cron: ${CONTEXT_RECOMPUTE_CRON:0 20 3 * * *}
    page-size: ${CONTEXT_RECOMPUTE_PAGE:1000}
