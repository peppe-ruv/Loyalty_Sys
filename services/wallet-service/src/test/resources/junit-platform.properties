# jqwik (ADR-053, Q-690, docs/06 §9): da jqwik 1.6 la configurazione sta qui, non in jqwik.properties.
# 1000 tentativi per proprietà in PR; il seme di ogni esecuzione è stampato nel riepilogo ("seed = …") e un
# controesempio trovato diventa un test a esempi permanente. Per riprodurre: @Property(seed = "…").
jqwik.tries.default = 1000
# Anche le proprietà riuscite stampano tentativi e seme (riepilogo nel log di surefire).
jqwik.reporting.onlyfailures = false
# Il database dei fallimenti sta sotto target/: non va committato e non sopravvive a `mvn clean`.
jqwik.database = target/jqwik-database
