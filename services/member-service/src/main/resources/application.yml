# member-service (docs/06 §4, §6, §8). server.port = ${PORT:8082}.
spring:
  application:
    name: member-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyaltyhub?currentSchema=member}
    username: ${DB_USERNAME:loyaltyhub}
    password: ${DB_PASSWORD:loyaltyhub}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/member
    schemas: member
    default-schema: member
    create-schemas: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8082}

loyaltyhub:
  service: member
  referral:
    # Tipo azione (forma breve) che completa il referral dell'invitato (docs/03 §8).
    qualifying-action-type: ${LH_REFERRAL_QUALIFYING_ACTION:purchase.completed}
  member:
    segments:
      # Ricalcolo periodico (docs/servizi/member-service.md §5): ogni 15 minuti, solo con loyaltyhub.jobs.enabled=true.
      refresh-interval-ms: ${LH_SEGMENTS_REFRESH_MS:900000}
      # Dopo seed/reset: ri-annuncio delle appartenenze per gli snapshot azzerati dopo di noi (SPEC-GAP Q-91); 0 = mai.
      reannounce-delay-ms: ${LH_SEGMENTS_REANNOUNCE_MS:15000}
  kafka:
    security: ${KAFKA_SECURITY:PLAINTEXT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
