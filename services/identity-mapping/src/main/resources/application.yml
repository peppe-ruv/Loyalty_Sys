spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
  application:
    name: identity-mapping
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty}
    username: ${DB_USER:loyalty}
    password: ${DB_PASSWORD:loyalty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: identitymapping
    default-schema: identitymapping

server:
  port: 8087
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      service: identity-mapping
  # RF-118: tracing distribuito e metriche con etichette comuni; l'endpoint OTLP arriva dall'ambiente (OTEL_EXPORTER_OTLP_ENDPOINT)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.2}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      application: identity-mapping
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
    export:
      prometheus:
        enabled: true
logging:
  structured:
    format:
      console: ecs

# Sicurezza delle API interne (RF-43): spenta in locale, accesa per ambiente dalle variabili.
loyalty:
  security:
    enabled: ${INTERNAL_AUTH_ENABLED:false}
    required-scope: ${INTERNAL_AUTH_SCOPE:loyalty.internal}
    token-uri: ${OIDC_TOKEN_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    client:
      enabled: ${INTERNAL_AUTH_ENABLED:false}
