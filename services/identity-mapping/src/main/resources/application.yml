spring:
  application:
    name: identity-mapping
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty}
    username: ${DB_USER:loyalty}
    password: ${DB_PASSWORD:loyalty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: identitymapping
    default-schema: identitymapping

server:
  port: 8087
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      service: identity-mapping
logging:
  structured:
    format:
      console: ecs
