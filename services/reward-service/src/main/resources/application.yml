# reward-service (docs/06 §4, §6, §8). server.port = ${PORT:8085}.
spring:
  application:
    name: reward-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyaltyhub?currentSchema=reward}
    username: ${DB_USERNAME:loyaltyhub}
    password: ${DB_PASSWORD:loyaltyhub}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/reward
    schemas: reward
    default-schema: reward
    create-schemas: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8085}

loyaltyhub:
  # Approvazioni accese da M7 (docs/06 §7, docs/11 §8).
  approval:
    enabled: ${LH_APPROVAL_ENABLED:true}
  service: reward
  kafka:
    security: ${KAFKA_SECURITY:PLAINTEXT}
  # Job schedulati (timeout richieste, scadenza coupon) — disabilitati di default.
  jobs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
